name: Bug report / Error
description: Something does not work as expected · Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real team data (names, emails, evaluations). · No pegues datos reales del equipo (nombres, correos, evaluaciones).
  - type: input
    id: version
    attributes:
      label: Version · Versión
      description: Shown under the title, e.g. "version 09/11/2026 21:47" · Aparece bajo el título
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser · Navegador
      options: [Microsoft Edge, Google Chrome, Other · Otro]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and how to reproduce it · Qué ha pasado y cómo reproducirlo
      placeholder: "1. …\n2. …\nExpected: … / Esperado: …"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors (F12 → Console), if any · Errores de la consola, si los hay
      render: text
