name: Release

# Push a tag like v1.0.0 to publish GanttCrew.html as a release asset.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/GanttCrew.html
          generate_release_notes: true
