name: Release

# Publish a release on GitHub (Releases → Draft a new release, tag e.g. v1.0.0):
# this workflow builds GanttCrew.html and attaches it, with the HTML user manuals, to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - name: Attach GanttCrew.html and the user manuals to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/manual.es.html "dist/MANUAL-DE-USUARIO.html"
          cp docs/manual.en.html "dist/USER-MANUAL.html"
          gh release upload "${{ github.event.release.tag_name }}" dist/GanttCrew.html \
            dist/MANUAL-DE-USUARIO.html dist/USER-MANUAL.html --clobber
