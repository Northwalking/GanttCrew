<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GanttCrew · Gantt del equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8;
  --card: #fff;
  --ink: #1c2230;
  --mut: #667085;
  --line: #e4e7ec;
  --soft: #f0f2f5;
  --acc: #2f5bea;
  --accs: #e9eefe;
  --ok: #12805c;
  --oks: #e3f4ec;
  --warn: #b54708;
  --warns: #fdf0e1;
  --bad: #c4320a;
  --bads: #fde8e1;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
  flex-wrap: wrap;
}
header h1 {
  font-size: 15px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.ovm.ovy {
  border-left: 2px solid #98a2b3 !important;
}
.hm.hy {
  border-left: 2px solid #98a2b3;
  overflow: visible;
  z-index: 1;
}
.pgap {
  position: absolute;
  height: 18px;
  z-index: 2;
  background: linear-gradient(#fff, #fff);
  background:
    repeating-linear-gradient(90deg, #667085 0 3px, transparent 3px 7px) 0 50%/100% 2px no-repeat,
    #fff;
  pointer-events: auto;
}
.pgap b {
  position: absolute;
  left: 1px;
  top: -1px;
  font-size: 10px;
  color: #667085;
  font-weight: 400;
  line-height: 18px;
}
.pfade {
  position: absolute;
  height: 18px;
  z-index: 2;
  border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(
    45deg,
    rgba(255, 255, 255, 0.75) 0 4px,
    rgba(255, 255, 255, 0.35) 4px 8px
  );
}
.pfade.cancel {
  background: repeating-linear-gradient(
    45deg,
    rgba(240, 242, 245, 0.9) 0 4px,
    rgba(208, 213, 221, 0.6) 4px 8px
  );
}
.pmark {
  position: absolute;
  z-index: 6;
  font-size: 11px;
  line-height: 12px;
  width: 13px;
  text-align: center;
  border-radius: 3px;
  background: #fff;
  border: 1px solid #98a2b3;
  color: #475467;
}
.pmark.cancel {
  color: #b42318;
  border-color: #fda29b;
}
.pzbox {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fcfcfd;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pzf {
  border: 1px solid #c7d7fe;
  background: #f5f8ff;
  border-radius: 8px;
  padding: 10px 12px;
}
.pzt {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
}
.pzt th {
  text-align: left;
  color: var(--mut);
  font-weight: 500;
  border-bottom: 1px solid var(--line);
  padding: 3px 6px;
}
.pzt td {
  border-bottom: 1px solid var(--soft);
  padding: 4px 6px;
  vertical-align: top;
}
.bar.privb {
  outline: 1.5px dashed #475467;
  outline-offset: 1px;
}
.absband.nws {
  border-left: none;
  background: repeating-linear-gradient(90deg, rgba(152, 162, 179, 0.28) 0 2px, transparent 2px 4px);
}
.nwsd {
  position: absolute;
  height: 18px;
  z-index: 3;
  background: rgba(255, 255, 255, 0.55);
  pointer-events: none;
}
.xmark {
  position: absolute;
  z-index: 7;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #039855;
  color: #fff;
  font-size: 11px;
  line-height: 12px;
  text-align: center;
  font-weight: 700;
  box-shadow: 0 0 0 1.5px #fff;
}
.calhead {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  margin: 2px 0 14px;
  flex-wrap: wrap;
}
.calhead > div:first-child {
  flex: 1 1 520px;
  min-width: 0;
}
.calhead h2 {
  margin: 2px 0 0;
  font-size: 24px;
  letter-spacing: -0.02em;
}
.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--acc);
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.seg button {
  border: 0;
  background: none;
  padding: 7px 12px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--mut);
}
.seg button.on {
  background: var(--accs);
  color: var(--acc);
  font-weight: 600;
}
.calcard {
  padding: 14px 16px;
}
.cmx-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.cmx {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
  font-size: 11.5px;
}
.cmx th,
.cmx td {
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--soft);
  padding: 0;
  text-align: center;
  text-transform: none;
  letter-spacing: 0;
}
.cmx thead th {
  background: #f9fafb;
  padding: 6px 0;
  min-width: 44px;
  cursor: pointer;
  color: #344054;
  position: sticky;
  top: 0;
  z-index: 2;
}
.cmx thead th b {
  display: block;
  font-size: 13px;
}
.cmx thead th small {
  display: block;
  font-size: 10px;
  color: var(--mut);
  font-weight: 500;
}
.cmx thead th.cwe,
.cmx thead th.chol {
  color: #98a2b3;
}
.cmx thead th.chol b {
  color: #d92d20;
}
.cmx thead th.ctoday {
  box-shadow: inset 0 -3px 0 #d92d20;
}
.cmx thead th.ctoday b {
  color: #d92d20;
}
.cmx .cmx-n {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #fff;
  text-align: left;
  padding: 8px 12px;
  min-width: 170px;
  border-right: 1px solid var(--line);
}
.cmx thead .cmx-n {
  background: #f9fafb;
  z-index: 4;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--mut);
}
.cmx .cmx-n a {
  font-weight: 600;
  color: #101828;
  text-decoration: none;
  display: block;
}
.cmx .cmx-n a:hover {
  color: var(--acc);
}
.cmx .cmx-n small {
  color: var(--mut);
  font-size: 11px;
}
.cx {
  height: 52px;
  cursor: pointer;
  position: relative;
  background: #fff;
  vertical-align: middle;
}
.cx b {
  display: block;
  font-size: 12px;
  font-weight: 700;
}
.cx small {
  display: block;
  font-size: 10px;
  opacity: 0.85;
}
.cx .cx-d {
  color: #c0c5cf;
}
.cx.s-task {
  background: #ecfdf3;
  color: #067647;
}
.cx.s-meet {
  background: #eff4ff;
  color: #1849a9;
}
.cx.s-high {
  background: #fffaeb;
  color: #b54708;
}
.cx.s-over {
  background: #fef3f2;
  color: #b42318;
}
.cx.s-abs {
  background: #fdf2fa;
  color: #c11574;
}
.cx.s-we,
.cx.s-hol,
.cx.s-off {
  background: #f2f4f7;
}
.cx.ctoday {
  box-shadow: inset 2px 0 0 #d92d20;
}
.cx.csel,
.cmx thead th.csel {
  outline: 2px solid var(--acc);
  outline-offset: -2px;
}
.cx-x {
  position: absolute;
  top: 2px;
  right: 3px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #039855;
  color: #fff;
  font-size: 10px;
  line-height: 12px;
  font-style: normal;
  font-weight: 700;
  display: inline-block;
  text-align: center;
}
.cleg {
  margin-top: 10px;
}
.cleg .lg {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid var(--line);
  margin-right: 5px;
  vertical-align: -2px;
}
.lg.task {
  background: #ecfdf3;
}
.lg.meet {
  background: #eff4ff;
}
.lg.high {
  background: #fffaeb;
}
.lg.over {
  background: #fef3f2;
}
.lg.abs {
  background: #fdf2fa;
}
.lg.we {
  background: #f2f4f7;
}
.cal-k {
  margin-top: 14px;
}
.cdet {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.cpc {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: #fff;
}
.cpc a {
  color: #101828;
  text-decoration: none;
}
.cpc a:hover {
  color: var(--acc);
}
.citem {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  background: #fff;
}
.citem:hover {
  border-color: var(--acc);
}
.citem b {
  display: block;
  color: var(--acc);
  font-size: 12.5px;
}
.citem small {
  color: var(--mut);
  font-size: 11.5px;
}
.citem.meet b {
  color: #1849a9;
}
.cind {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1100px) {
  .cind {
    grid-template-columns: 1fr;
  }
}
.cmg {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--line);
  gap: 1px;
}
.cmg-h {
  background: #f9fafb;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--mut);
  padding: 7px 0;
}
.cmg-c {
  background: #fff;
  min-height: 92px;
  padding: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
}
.cmg-c.empty {
  background: #fafbfc;
  cursor: default;
}
.cmg-c.cwe {
  background: #f6f7f9;
}
.cmg-c.ctoday .cmg-d {
  background: #d92d20;
  color: #fff;
  border-radius: 999px;
  padding: 0 6px;
}
.cmg-c.csel {
  outline: 2px solid var(--acc);
  outline-offset: -2px;
}
.cmg-d {
  font-size: 12px;
  font-weight: 600;
  color: #344054;
  align-self: flex-start;
}
.pl {
  font-size: 10.5px;
  border-radius: 5px;
  padding: 2px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pl.task {
  background: #ecfdf3;
  color: #067647;
}
.pl.high {
  background: #fffaeb;
  color: #b54708;
}
.pl.over {
  background: #fef3f2;
  color: #b42318;
}
.pl.meet {
  background: #eff4ff;
  color: #1849a9;
}
.pl.abs {
  background: #fdf2fa;
  color: #c11574;
}
.pl.hol {
  background: #fef3f2;
  color: #d92d20;
}
.pl.ext {
  background: #dcfae6;
  color: #067647;
}
.cside {
  position: sticky;
  top: 12px;
}
.cbox {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: #fcfcfd;
}
.gk {
  background: #f9fafb;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 14px;
  min-width: 110px;
}
.gk small {
  display: block;
  color: var(--mut);
  font-size: 11px;
}
.gk b {
  font-size: 20px;
}
.gtools {
  padding: 14px 16px;
  margin-bottom: 12px;
}
.gtrow {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.gtrow select {
  min-width: 150px;
  max-width: 240px;
}
.gtrow2 {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--soft);
}
.gtrow2 select {
  min-width: 0;
}
.gtl {
  font-size: 12px;
}
.grow.gt .lbl.gl {
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 2px;
}
.gl1 {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
}
.gl1 .tname {
  font-weight: 600;
  color: #101828;
  font-size: 12.5px;
}
.gl2 {
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  padding-left: 27px;
}
.gl3 {
  display: flex;
  gap: 4px;
  padding-left: 27px;
  transform: scale(0.92);
  transform-origin: left center;
}
.grow.gt .bar,
.grow.gt .fcext,
.grow.gt .pgap,
.grow.gt .pfade,
.grow.gt .nwsd {
  height: 22px;
}
.grow.gt .bar {
  border-radius: 6px;
}
.grow.gt .real {
  bottom: auto;
  top: 47px;
}
.bpct {
  position: absolute;
  left: 7px;
  top: 0;
  line-height: 22px;
  font-size: 10.5px;
  color: #fff;
  font-weight: 700;
  font-style: normal;
  z-index: 1;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.35);
  pointer-events: none;
}
.fcdia {
  position: absolute;
  top: 9px;
  width: 10px;
  height: 10px;
  background: #dc6803;
  transform: rotate(45deg);
  z-index: 6;
  border-radius: 1px;
  box-shadow: 0 0 0 1.5px #fff;
}
.fcstk {
  position: absolute;
  top: 13px;
  width: 2px;
  height: 38px;
  background: #dc6803;
  z-index: 5;
  pointer-events: none;
}
.grow.proj .lbl {
  font-size: 13px;
  color: #101828;
  text-transform: none;
}
.wload {
  position: absolute;
  bottom: 6px;
  height: 14px;
  border-radius: 3px;
  opacity: 0.85;
  z-index: 2;
  font-size: 9.5px;
  line-height: 14px;
  color: #fff;
  font-weight: 700;
  text-align: center;
  overflow: hidden;
}
.bell {
  position: relative;
  font-size: 14px;
  padding: 3px 8px;
}
.bellN {
  position: absolute;
  top: -6px;
  right: -7px;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  background: #98a2b3;
  color: #fff;
  font-size: 10.5px;
  line-height: 17px;
  text-align: center;
  font-weight: 700;
  padding: 0 4px;
}
.bellN.new {
  background: #d92d20;
}
.alh {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mut);
  margin: 12px 0 6px;
}
.alrow {
  border: 1px solid var(--line);
  border-left: 3px solid #f79009;
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  background: #fff;
}
.alrow.bad {
  border-left-color: #d92d20;
}
.alrow:hover {

}
header h1 span {
  color: var(--mut);
  font-weight: 500;
}
.brandbox {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  flex: 0 0 auto;
}
.ver {
  font-size: 10.5px;
  color: var(--mut);
  white-space: nowrap;
  margin-top: 1px;
}
.gver {
  margin-top: 14px;
  font-size: 11px;
  color: var(--mut);

}
nav {
  display: flex;

  flex-wrap: wrap;
}

  padding: 7px 12px;

}

}

}
main {

}

}
.btn {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 7px;

}
.btn:hover {

}
.btn.pri {
  background: var(--acc);

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 7px;

  border: 0;

select,
input[type='text'],
input[type='date'],
input[type='time'],
input[type='number'],
input[type='email'],
input[type='search'],

textarea {

.card {

table {
  width: 100%;

}
th {
  text-align: left;
  font-weight: 600;
  color: var(--mut);

  text-transform: uppercase;

}
td {

/* ---------- idioma / language (ES · EN) ----------
   The app is written in Spanish. When English is chosen, every visible text
   is translated on the fly with the dictionary in i18n/en.tsv (embedded at
   build time as I18N_EN). Stored data (JSON files) is never translated. */
let LANG = (() => {
  try {
    return localStorage.getItem('gantt.lang') === 'en' ? 'en' : 'es';
  } catch (e) {
    return 'es';

/* ---------- utilidades ---------- */
// "HH:MM" <-> minutes of the day (meetings store start time + duration; the forms show an end time)
const hm2min = (s) => (/^\d{1,2}:\d{2}/.test(s || '') ? +s.split(':')[0] * 60 + +s.split(':')[1] : null);
const min2hm = (n) => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const endTime = (time, dur) =>
  hm2min(time) == null ? '' : min2hm(Math.min(1439, hm2min(time) + (+dur || 60)));
const $ = (s) => document.querySelector(s);
const esc = (s) =>
  String(s ?? '').replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );

/* ---------- Markdown básico para notas (negrita, cursiva, listas, enlaces) ---------- */
// Inline: **bold**, *italic*, and http(s) links. The text is escaped first, so no HTML gets through.
function mdInline(s) {
  return esc(s)
    .replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, '<b>$1</b>')
    .replace(/(?<![*\w])\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?![*\w])/g, '<i>$1</i>')
    .replace(
      /(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:)!?])/g,
      '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>',
    );
}
// Blocks: lines starting with "- " / "* " are bullets, "1. " numbered items; the rest are paragraphs
function mdBlocks(text) {
  const out = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const ln = raw.trimEnd();
    let m;
    if ((m = ln.match(/^\s*[-*•]\s+(.*)$/))) out.push({ k: 'ul', t: m[1] });
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) out.push({ k: 'ol', t: m[1] });
    else out.push({ k: ln.trim() ? 'p' : 'br', t: ln.trim() });
  }
  while (out.length && out[out.length - 1].k === 'br') out.pop();
  return out;
}
// Inline text as runs for the Word export: [{t, b, i}]
function mdRuns(s) {
  const out = [],
    re = /\*\*(?=\S)(.+?)(?<=\S)\*\*|(?<![*\w])\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?![*\w])/g;
  let last = 0,
    m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ t: s.slice(last, m.index) });
    out.push(m[1] != null ? { t: m[1], b: 1 } : { t: m[2], i: 1 });
    last = re.lastIndex;
  }
  if (last < s.length) out.push({ t: s.slice(last) });
  return out;
}
function mdHtml(text) {
  const bl = mdBlocks(text);
  let h = '',
    open = '';
  const close = () => {
    if (open) h += `</${open}>`;
    open = '';
  };
  bl.forEach((b, i) => {
    if (b.k === 'ul' || b.k === 'ol') {
      if (open !== b.k) {
        close();
        h += `<${b.k}>`;
        open = b.k;
      }
      h += `<li>${mdInline(b.t)}</li>`;
    } else {
      close();
      if (b.k === 'p') h += mdInline(b.t) + (bl[i + 1] && bl[i + 1].k === 'p' ? '<br>' : '');
      else if (bl[i - 1] && bl[i - 1].k === 'p') h += '<br><br>';
    }
  });
  close();
  return h;
}
// A notes field with Markdown: shows the formatted text; click to edit, leave the field to see it again
function mdField(ta, opt = {}) {
  if (!ta || ta.dataset.md) return;
  ta.dataset.md = 1;
  const pv = document.createElement('div');
  pv.className = 'mdv';
  pv.setAttribute('data-notr', '');
  pv.tabIndex = ta.disabled ? -1 : 0;
  ta.insertAdjacentElement('beforebegin', pv);
  const hint = document.createElement('div');
  hint.className = 'mdhint';
  hint.textContent = 'Formato: **negrita**, *cursiva*, listas con «- » o «1. »';
  ta.insertAdjacentElement('afterend', hint);
  const show = () => {
    const has = ta.value.trim() !== '';
    pv.innerHTML = mdHtml(ta.value);
    pv.style.display = has ? '' : 'none';
    ta.style.display = has ? 'none' : '';
    hint.style.display = has || ta.disabled || opt.hint === false ? 'none' : '';
  };
  const edit = () => {
    if (ta.disabled) return;
    pv.style.display = 'none';
    ta.style.display = '';
    hint.style.display = opt.hint === false ? 'none' : '';
    ta.focus();
  };
  pv.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    e.preventDefault(); // the field sits inside a <label>
    edit();
  });
  pv.addEventListener('focus', edit);
  ta.addEventListener('blur', show);
  show();
}

// IndexedDB: recordar la carpeta elegida entre sesiones
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('gantt-equipo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const d = await idb();
    return await new Promise((r) => {
      const q = d.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => r(q.result);
      q.onerror = () => r(null);
    });
  } catch (e) {
    return null;
  }
}
async function kvSet(k, v) {
  try {
    const d = await idb();
    await new Promise((r) => {
      const t = d.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = r;
      t.onerror = r;
    });
  } catch (e) {}
}

async function readDir() {
  const seen = {};
  let changed = false;
  badFiles = [];
  for await (const [name, h] of dirH.entries()) {
    if (h.kind !== 'file') continue;
    const isTB = /^thunderbird-.*\.ics$/i.test(name);
    if (!isTB && !/\.json$/i.test(name)) continue;
    const f = await h.getFile();
    seen[name] = 1;
    const prev = FILES[name];
    if (prev && prev.lastModified === f.lastModified && prev.size === f.size) continue;
    if (isTB) {
      try {
        const t = await f.text();
        FILES[name] = { lastModified: f.lastModified, size: f.size, ics: t, events: parseICS(t) };
        changed = true;
      } catch (e) {
        badFiles.push(name);
      }
      continue;
    }
    try {
      const j = JSON.parse(await f.text());
      if (j.app !== APPID) continue;
      FILES[name] = { lastModified: f.lastModified, size: f.size, data: j };
      changed = true;
    } catch (e) {
      badFiles.push(name);
    } // p. ej. OneDrive escribiéndolo justo ahora: se reintenta en la próxima lectura
  }
  for (const n of Object.keys(FILES))
    if (!seen[n]) {
      delete FILES[n];
      changed = true;
    }
  lastSync = Date.now();
  return changed;
}

const MADRID_TZ =
  /madrid|romance|central europe|w\. europe|europe\/(paris|brussels|berlin|rome|vienna|amsterdam)|cet/i;
function icsOccurrences(events, from, to) {
  const byEmail = {},
    byName = {};
  for (const [id, m] of Object.entries(S.members || {})) {
    if (m.email) byEmail[String(m.email).trim().toLowerCase()] = id;
    byName[
      String(m.name || '')
        .trim()
        .toLowerCase()
    ] = id;
  }
  const moved = {};
  for (const e of events)
    if (e.props['RECURRENCE-ID']) {
      const r = icsTime(e.props['RECURRENCE-ID'].value, e.props['RECURRENCE-ID'].params || {});
      if (r) moved[(e.props.UID?.value || '') + '|' + r.date] = 1;
    }
  const out = [];
  for (const e of events) {
    if ((e.props.STATUS?.value || '').toUpperCase() === 'CANCELLED') continue;
    const uid = e.props.UID?.value || hashStr(JSON.stringify(e.props.SUMMARY || '') + e.props.DTSTART?.value);
    const sp = e.props.DTSTART?.params || {},
      st = icsTime(e.props.DTSTART?.value, sp);
    if (!st) continue;
    let dur = null;
    if (e.props.DURATION) dur = icsDur(e.props.DURATION.value);
    else if (e.props.DTEND) {
      const en = icsTime(e.props.DTEND.value, e.props.DTEND.params || {});
      if (en) dur = st.allDay ? 0 : (dn(en.date) - dn(st.date)) * 1440 + minOf(en.time) - minOf(st.time);
    }
    const dates = e.props['RECURRENCE-ID']
      ? ((d) => (d >= from && d <= to ? [st.date] : []))(dn(st.date))
      : expandEvent(e, from, to).filter((d) => !moved[uid + '|' + d]);
    const atts = new Set(ME.memberId ? [ME.memberId] : []);
    for (const a of e.attendees) {
      if ((a.part || '').toUpperCase() === 'DECLINED') continue;
      const m = byEmail[a.email] || byName[(a.name || '').toLowerCase()];
      if (m) atts.add(m);
    }
    const loc = e.props.LOCATION ? icsUnesc(e.props.LOCATION.value) : '',
      desc = e.props.DESCRIPTION ? icsUnesc(e.props.DESCRIPTION.value) : '';
    const tz = sp.TZID || '';
    const tzWarn = !st.allDay && tz && !MADRID_TZ.test(tz) && !/Z$/.test(e.props.DTSTART.value);
    for (const d of dates)
      out.push({
        key: uid + '|' + d,
        uid,
        date: d,
        time: st.time,
        allDay: !!st.allDay,
        duration: st.allDay ? 0 : Math.max(0, dur ?? 60),
        title: icsUnesc(e.props.SUMMARY?.value || '(sin título)'),
        notes: [loc && 'Lugar: ' + loc, desc.length > 1500 ? desc.slice(0, 1500) + '…' : desc]
          .filter(Boolean)
          .join('\n'),
        attendees: [...atts],
        tz,
        tzWarn,
        organizer: (e.attendees.find((a) => a.org) || {}).name || '',
      });
  }
  return out.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
}
// Saca el calendario de un correo guardado (.eml): la convocatoria va en una parte text/calendar,
// a menudo codificada en base64 o quoted-printable.
function calendarFromEML(raw) {
  const direct = /BEGIN:VCALENDAR[\s\S]*?END:VCALENDAR/i.exec(raw);
  if (direct) return direct[0];
  const dec = (body, enc, cs) => {
    enc = (enc || '').toLowerCase();
    let bytes;
    if (enc === 'base64') {
      const b = atob(body.replace(/[^A-Za-z0-9+/=]/g, ''));
      bytes = Uint8Array.from(b, (c) => c.charCodeAt(0));
    } else if (enc === 'quoted-printable') {
      const t = body.replace(/=\r?\n/g, '');
      const out = [];
      for (let i = 0; i < t.length; i++) {
        if (t[i] === '=' && /^[0-9A-F]{2}$/i.test(t.substr(i + 1, 2))) {
          out.push(parseInt(t.substr(i + 1, 2), 16));
          i += 2;
        } else out.push(t.charCodeAt(i) & 255);
      }
      bytes = new Uint8Array(out);
    } else bytes = Uint8Array.from(body, (c) => c.charCodeAt(0) & 255);
    try {
      return new TextDecoder(cs || 'utf-8').decode(bytes);
    } catch (e) {
      return new TextDecoder('utf-8').decode(bytes);
    }
  };
  const parts = raw.split(/\r?\n--[^\r\n]+\r?\n/);
  for (const p of parts) {
    const i = p.search(/\r?\n\r?\n/);
    if (i < 0) continue;
    const head = p.slice(0, i),
      body = p.slice(i).replace(/^\r?\n\r?\n/, '');
    if (!/content-type:\s*(text\/calendar|application\/ics)/i.test(head)) continue;
    const enc = (/content-transfer-encoding:\s*([\w-]+)/i.exec(head) || [])[1],
      cs = (/charset="?([\w-]+)/i.exec(head) || [])[1];
    const txt = dec(body.replace(/\r?\n--[\s\S]*$/, ''), enc, cs);
    const m = /BEGIN:VCALENDAR[\s\S]*?END:VCALENDAR/i.exec(txt);
    if (m) return m[0];
  }
  return '';
}

/* ---------- calendarios .ics (Thunderbird / Outlook) ---------- */
// La herramienta escribe en la carpeta de datos un .ics por persona (lo regenera su propio
// navegador) y el PM, además, el del equipo. Cada archivo tiene un solo escritor: sin conflictos.
const slug = (t) =>
  String(t || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') || 'x';
const icsName = (mid) => (mid ? `calendario-${slug(S.members[mid]?.name)}.ics` : 'calendario-equipo.ics');
function icsEsc(t) {
  return String(t ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\;')
    .replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');
}
function icsFold(l) {
  const out = [];
  let cur = '',
    n = 0;
  for (const ch of l) {
    const b = new TextEncoder().encode(ch).length;
    if (n + b > 74) {
      out.push(cur);
      cur = ' ';
      n = 1;
    }
    cur += ch;
    n += b;
  }
  out.push(cur);
  return out.join('\r\n');
}
function buildICS(mid) {
  const L = [],
    D = (s) => String(s).replace(/-/g, ''),
    next = (s) => D(iso(dn(s) + 1));
  const ev = (uid, sum, when, desc, cat) => {
    L.push(
      'BEGIN:VEVENT',
      'UID:' + uid + '@gantt-equipo',
      'DTSTAMP:20260101T000000Z',
      ...when,
      'SUMMARY:' + icsEsc(T(sum)),
    );
    if (desc) L.push('DESCRIPTION:' + icsEsc(T(desc)));
    if (cat) L.push('CATEGORIES:' + icsEsc(T(cat)));
    L.push('TRANSP:' + (cat === 'Tarea' ? 'TRANSPARENT' : 'OPAQUE'), 'END:VEVENT');
  };
  const allDay = (a, b) => ['DTSTART;VALUE=DATE:' + D(a), 'DTEND;VALUE=DATE:' + next(b || a)];
  for (const h of arr('holidays')) {
    if (mid && !holApplies(h, mid)) continue;
    ev('hol-' + h.id, 'Festivo: ' + h.name, allDay(h.date), holScopeLabel(h), 'Festivo');
  }
  for (const x of arr('extras')) {
    if (mid && x.memberId !== mid) continue;
    const t = x.taskId ? S.tasks[x.taskId] : null;
    if (t && S.projects[t.projectId]?.priv) continue;
    ev(
      'ext-' + x.id,
      (mid ? '' : (mem(x.memberId)?.name || '?') + ' · ') + 'Jornada extra (' + x.hours + ' h)',
      allDay(x.date),
      [t ? 'Tarea: ' + t.name : '', x.note].filter(Boolean).join('\n'),
      'Jornada extra',
    );
  }
  for (const a of arr('absences')) {
    if (mid && a.memberId !== mid) continue;
    const lbl = a.type === 'baja' && a.memberId !== mid ? 'Ausente' : ABS[a.type]?.t || 'Ausencia';
    ev(
      'abs-' + a.id,
      (mid ? '' : (mem(a.memberId)?.name || '?') + ' · ') + lbl,
      allDay(a.start, a.end),
      a.type === 'baja' ? '' : a.note || '',
      'Ausencia',
    );
  }
  for (const m of arr('meetings')) {
    if (mid && !(m.attendees || []).includes(mid)) continue;
    if (m.source === 'thunderbird' && mid && m.createdBy === mid) continue;
    if (!m.date) continue;
    const p = S.projects[m.projectId];
    const when = m.time
      ? (() => {
          const [hh, mm] = m.time.split(':').map(Number);
          const st = new Date(Date.UTC(2000, 0, 1, hh, mm));
          const en = new Date(st.getTime() + (+m.duration || 60) * 60000);
          const f = (d) =>
            String(d.getUTCHours()).padStart(2, '0') + String(d.getUTCMinutes()).padStart(2, '0') + '00';
          const endDay = en.getUTCDate() > 1 ? next(m.date) : D(m.date);
          return [
            'DTSTART;TZID=Europe/Madrid:' + D(m.date) + 'T' + f(st),
            'DTEND;TZID=Europe/Madrid:' + endDay + 'T' + f(en),
          ];
        })()
      : allDay(m.date);
    ev(
      'mtg-' + m.id,
      'Reunión: ' + m.title,
      when,
      [
        MTYPE[m.type],
        p?.name,
        'Asistentes: ' +
          (m.attendees || [])
            .map((x) => mem(x)?.name)
            .filter(Boolean)
            .join(', '),
        m.notes,
      ]
        .filter(Boolean)
        .join('\n'),
      'Reunión',
    );
  }
  for (const t of arr('tasks')) {
    if (t.priv || t.status === 'done' || !t.end || inact(t)) continue;
    if (mid && t.assigneeId !== mid) continue;
    const p = S.projects[t.projectId];
    ev(
      'task-' + t.id,
      'Entrega: ' + t.name + (mid ? '' : ' · ' + (mem(t.assigneeId)?.name || 'sin asignar')),
      allDay(t.end),
      [
        p?.name,
        `Plan: ${fmt(t.start)}–${fmt(t.end)} · avance ${t.progress || 0}%`,
        blockers(t).length ? 'Bloqueada por: ' + blockers(t).map(tlabel).join(', ') : '',
      ]
        .filter(Boolean)
        .join('\n'),
      'Tarea',
    );
  }
  const name = mid ? 'Gantt · ' + (mem(mid)?.name || '') : 'Gantt · Equipo';
  const head = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//GanttCrew//ES',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc(name),
    'X-WR-TIMEZONE:Europe/Madrid',
    'BEGIN:VTIMEZONE',
    'TZID:Europe/Madrid',
    'BEGIN:DAYLIGHT',
    'TZOFFSETFROM:+0100',
    'TZOFFSETTO:+0200',
    'TZNAME:CEST',
    'DTSTART:19700329T020000',
    'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU',
    'END:DAYLIGHT',
    'BEGIN:STANDARD',
    'TZOFFSETFROM:+0200',
    'TZOFFSETTO:+0100',
    'TZNAME:CET',
    'DTSTART:19701025T030000',
    'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU',
    'END:STANDARD',
    'END:VTIMEZONE',
  ];
  return [...head, ...L, 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
}
const lastICS = {};

async function writeICSFiles() {
  const jobs = [[ME.memberId, icsName(ME.memberId)]];
  if (ME.owner) jobs.push([null, icsName(null)]);
  for (const [mid, name] of jobs) {
    const txt = buildICS(mid);
    if (lastICS[name] === txt) continue;
    try {
      const h = await dirH.getFileHandle(name, { create: true });
      const w = await h.createWritable();
      await w.write(txt);
      await w.close();
      lastICS[name] = txt;
    } catch (e) {}
  }
}
function downloadICS(mid) {
  const blob = new Blob([buildICS(mid)], { type: 'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = icsName(mid);
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}

async function migratePauses() {

    if (p.status === 'paused' && Array.isArray(p.pausedTasks)) {
      const from = p.pausedAt || todayS(),
        grp = 'pg-' + newId(),
        ids = [];

        const x = T(id);

        ...(o.pauses || []).map((x) => ({ k: 'pause', from: x.from, to: x.to, why: '', tasks: [] })),

        { k: 'cancel', from, to: '', why: p.cancelReason || '', grp, tasks: ids },
      ];

      }

    h += `</div></div>`;
  }
  h += `</div></div><div class="legend"><span>Franja inferior = carga semanal: <span class="dot" style="background:#32d583;border-radius:2px"></span> &lt; 85% <span class="dot" style="background:#f79009;border-radius:2px"></span> 85–100% <span class="dot" style="background:#f04438;border-radius:2px"></span> &gt; 100% sobrecarga</span><span><span class="absband" style="position:static;display:inline-block;width:22px;height:12px"></span>Ausencia</span><span><span style="display:inline-block;width:12px;height:12px;background:#fde2e1"></span>Festivo</span><span>Barras coloreadas por miembro; el texto emergente indica el proyecto.</span><span><span class="mdot" style="position:static;display:inline-block"></span>Reunión a la que asiste (en Mes y Semana, etiqueta con hora y título; clic para abrirla)</span><span>Las tareas que se solapan se apilan: más carriles = más carga en paralelo.</span></div>`;

      )
      .join('');
    h += `<tr class="click" data-task="${t.id}"><td><span class="who"><span class="dot" style="background:${esc(p?.color || '#98a2b3')}"></span>${esc(p?.code || p?.name || '—')}</span></td><td><b style="font-weight:500">${esc(t.name)}</b>${t.priority === 'alta' ? ' <span class="tag bad">alta</span>' : ''} ${depTags(t)}${projEndRisk(t) ? ` <span class="tag bad" title="Acaba o está prevista después del fin objetivo del proyecto">Fuera del plazo del proyecto</span>` : ''}</td><td><span class="tag ${o.c}">${o.t}</span></td><td>${who(t.assigneeId)}</td><td>${fmt(t.start)}</td><td>${fmt(t.end)}</td><td>${fcTag(t)}</td><td>${fmt(t.realEnd)}</td><td><div style="display:flex;gap:6px;align-items:center"><div class="pbar"><i style="width:${t.progress || 0}%"></i></div>${t.progress || 0}%</div></td><td style="font-size:12px">${dp || '<span class="mut">—</span>'}</td><td>${STAT[t.status] || 'Pendiente'}</td><td>${statusCell(t)}</td></tr>`;
  }
  return h + `</tbody></table></div>`;
}

/* ---------- vista: reuniones ---------- */
function vReuniones() {
  const ms = members();
  const per = UI.meetPeriod;
  const inPer = (x) =>
    per === 'future'
      ? (x.date || '') >= todayS()
      : per === 'all'
        ? (x.date || '').startsWith(String(UI.year))
        : (x.date || '').startsWith(per);
  const q = norm(UI.meetQ || ''),
    sel = UI.meetSel;
  const months = [];
  for (let m = 0; m < 12; m++) months.push(`${UI.year}-${String(m + 1).padStart(2, '0')}`);
  let h = `<div class="bar-tools"><button class="btn" id="yPrev">‹</button><b style="font-size:14px">${UI.year}</b><button class="btn" id="yNext">›</button><select id="perSel"><option value="future" ${per === 'future' ? 'selected' : ''}>Desde hoy (todas las futuras)</option><option value="all" ${per === 'all' ? 'selected' : ''}>Todo el año</option>${months.map((m, i) => `<option value="${m}" ${per === m ? 'selected' : ''}>${MESL[i]}</option>`).join('')}</select><select id="mmSel"><option value="">Todos los asistentes</option>${ms.map((m) => `<option value="${m.id}" ${UI.meetMember === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select><input type="search" id="mQ" placeholder="🔍 Buscar por título…" title="Escribe parte del título (p. ej. «briefing») para ver solo esas reuniones; útil junto con «Seleccionar varias»" value="${esc(UI.meetQ || '')}" style="width:190px"><span class="sp"></span>${ME.memberId ? `<button class="btn ${sel ? 'pri' : ''}" id="mSelT">${sel ? 'Terminar selección' : 'Seleccionar varias'}</button>` : ''}${ME.memberId ? '<button class="btn" id="impIcs">Importar .ics</button><button class="btn pri" id="addMeet2">+ Reunión</button>' : ''}</div>`;
  const list = arr('meetings')
    .filter(inPer)
    .filter((x) => !UI.meetMember || (x.attendees || []).includes(UI.meetMember))
    .filter((x) => !q || norm(x.title).includes(q))
    .sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
  let sumT = `<table><thead><tr><th>Miembro</th><th>Reuniones</th><th>Horas</th><th>Con cliente</th><th>% de jornada*</th></tr></thead><tbody>`;
  const workdays = (() => {
    let s, e;
    if (per === 'future') {
      const L = list.length ? dn(list[list.length - 1].date) : todayN();
      s = todayN();
      e = Math.max(s + 1, L + 1);
    } else if (per === 'all') {
      s = dn(UI.year + '-01-01');
      e = dn(UI.year + 1 + '-01-01');
    } else {
      s = dn(per + '-01');
      const [y, m] = per.split('-').map(Number);
      e = dn(m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`);
    }
    let c = 0;
    for (let n = s; n < e; n++) {
      const w = dow(n);
      if (w && w < 6) c++;
    }
    return c;
  })();
  for (const m of ms) {
    const all_ = arr('meetings')
      .filter(inPer)
      .filter((x) => !q || norm(x.title).includes(q))
      .filter((x) => (x.attendees || []).includes(m.id));
    const mm = all_.filter((x) => isWorkM(m.id, dn(x.date)));
    const opt_ = all_.length - mm.length;
    const hrs = mm.reduce((a, x) => a + (+x.duration || 0), 0) / 60;
    const cl = mm.filter((x) => x.type === 'cliente').length;
    sumT += `<tr><td>${who(m.id)}${m.isPM ? ' <span class="tag mut">PM</span>' : ''}</td><td>${mm.length}${opt_ ? ` <span class="mut" title="Reuniones en fin de semana o festivo: opcionales, no cuentan en horas ni en la carga">+${opt_} opc.</span>` : ''}</td><td>${hrs.toFixed(1)}</td><td>${cl}</td><td>${workdays ? ((100 * hrs) / (workdays * 8)).toFixed(1) + '%' : '—'}</td></tr>`;
  }
  sumT += `</tbody></table><p class="hint">* Horas de reunión sobre ${workdays} días laborables × 8 h del periodo. Las reuniones en fin de semana o festivo son <b>opcionales</b> («opc.»): no cuentan en las horas, la carga ni las fechas previstas.</p>`;
  let lt = '';
  let cur = '';
  if (!list.length) lt = `<div class="empty">No hay reuniones registradas en este periodo.</div>`;
  for (const x of list) {
    const mk = (x.date || '').slice(0, 7);
    if (mk !== cur) {
      cur = mk;
      lt += `<div class="mhead">${MESL[+mk.slice(5, 7) - 1] || ''} ${mk.slice(0, 4)}</div>`;
    }
    const p = S.projects[x.projectId];
    const ce = canEditMeeting(x),
      on_ = sel && UI.meetPick.has(x.id);
    lt += `<div class="list-row" ${sel ? (ce ? `data-msel="${x.id}"` : 'title="No puedes modificar esta reunión"') : `data-meet="${x.id}"`} style="cursor:pointer;${on_ ? 'background:var(--accs)' : ''}${sel && !ce ? ';opacity:.5' : ''}">${sel ? `<input type="checkbox" ${on_ ? 'checked' : ''} ${ce ? '' : 'disabled'} style="width:16px;height:16px;margin:0 8px 0 0;flex:0 0 auto;pointer-events:none">` : ''}<div style="width:84px"><b>${fmt(x.date).slice(0, 5)}</b><div class="mut">${esc(x.time ? x.time + '–' + endTime(x.time, x.duration) : '')}</div></div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(x.title)}${x.seriesId ? ` <span class="tag mut" title="${esc(repeatLbl(SERIES[x.seriesId]?.repeat))}">↻ periódica</span>` : ''}${x.date && !isWork(dn(x.date)) ? ' <span class="tag warn" title="Cae en fin de semana: asistencia opcional; no cuenta en horas, carga ni fechas previstas">fin de semana · opcional</span>' : x.date && holAll(dn(x.date)).length ? ' <span class="tag warn" title="Cae en festivo: asistencia opcional; no cuenta en horas, carga ni fechas previstas">festivo · opcional</span>' : ''}${x.source === 'thunderbird' ? ' <span class="tag mut" title="Registrada desde Thunderbird">Thunderbird</span>' : x.source === 'ics' ? ' <span class="tag mut" title="Importada desde un .ics">.ics</span>' : ''}</div><div class="mut">${MTYPE[x.type] || ''} · ${x.duration || 0} min · ${p ? esc(p.code || p.name) : 'General'}</div></div><div style="display:flex;gap:2px">${(x.attendees || []).map((a) => who(a, true)).join('')}</div></div>`;
  }
  {
    const pend = arr('meetings').filter((x) => x.source === 'thunderbird' && !x.projectId && inPer(x)).length;
    if (pend)
      h += `<div class="note warn" style="margin-bottom:12px">📅 Hay <b>${pend}</b> convocatoria(s) de Thunderbird en este periodo sin proyecto asignado (etiqueta «Thunderbird» en la lista). Haz clic en cada una para asignarle proyecto y tipo.</div>`;
  }
  if (sel) {
    const vis = list.filter(canEditMeeting);
    h += `<div class="note info" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>${UI.meetPick.size}</b> reunión(es) seleccionada(s). Pulsa sobre las reuniones para marcarlas, o usa el buscador y el periodo para filtrar (por ejemplo, «briefing» + «Desde hoy»).</span><span class="sp"></span><button class="btn sm" id="mSelAll">Marcar las ${vis.length} visibles</button><button class="btn sm" id="mSelNone">Desmarcar todas</button><button class="btn sm pri" id="mSelEdit" ${UI.meetPick.size ? '' : 'disabled'}>Modificar las seleccionadas</button></div>`;
  }
  h += `<div class="grid2"><div class="card"><h3>Reuniones${q ? ` <span class="mut" style="font-weight:400">· «${esc(UI.meetQ)}»: ${list.length}</span>` : ''}</h3>${lt}</div><div class="card"><h3>Tiempo en reuniones por persona</h3>${sumT}</div></div>`;
  return h;
}

/* ---------- vista: cumplimiento ---------- */
function blocksCard(all) {
  const pairs = all.filter((t) => blocking(t).length);
  return `<div class="card"><h3>Bloqueos activos (${pairs.length})</h3>${
    pairs.length
      ? pairs
          .map(
            (t) =>
              `<div class="list-row" style="align-items:flex-start"><div style="flex:1"><div>${who(t.assigneeId, true)} <span class="tname" data-task="${t.id}" style="display:inline">${esc(t.name)}</span> <span class="mut">· fin ${fmt(t.end)} · ${t.progress || 0}%</span></div><div class="mut" style="padding-left:28px;margin-top:3px">bloquea a: ${blocking(
                t,
              )
                .map(
                  (s) =>
                    `${who(s.assigneeId, true)} <span class="tname" data-task="${s.id}" style="display:inline">${esc(s.name)}</span>`,
                )
                .join(' · ')}</div></div></div>`,
          )
          .join('')
      : '<div class="hint">Ninguna tarea está frenando a otra.</div>'
  }</div>`;
}
function vCumplimiento() {
  const all = arr('tasks').filter(
    (t) => !t.priv && (UI.proj.size === 0 || UI.proj.has(t.projectId)) && inact(t) !== 'cancelled',
  );
  const done = all.filter((t) => t.status === 'done');
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const onTime = done.filter((t) => t.realEnd && dn(t.realEnd) <= dn(t.end)).length,
    withReal = done.filter((t) => t.realEnd).length;
  const risk = all.filter(atRisk);
  const found = all.filter((t) => t.origin && t.origin !== 'plan').length;
  const blockedN = all.filter(depBlocked).length;
  const chips = `<div class="bar-tools">${projects()
    .map(
      (p) =>
        `<span class="chip ${UI.proj.has(p.id) ? 'on' : ''}" data-proj="${p.id}"><span class="dot" style="background:${esc(p.color || '#98a2b3')}"></span>${esc(p.code || p.name)}</span>`,
    )
    .join('')}<span class="sp"></span>`;
  const riskCard = `<div class="card"><h3>En riesgo (${risk.length})</h3>${
    risk.length
      ? risk
          .map((t) => {
            const x = health(t);
            return `<div class="list-row" data-task="${t.id}" style="cursor:pointer"><span style="flex:1">${esc(t.name)} <span class="mut">· fin ${fmt(t.end)} · ${t.progress || 0}%</span></span>${who(t.assigneeId, true)}<span class="tag ${x.c}">${x.t}</span></div>`;
          })
          .join('')
      : '<div class="hint">Nada en riesgo.</div>'
  }</div>`;
  const lateFc = all.filter((t) => t.status !== 'done' && fcOf(t).slip > 0).length;
  const commonK = `<div class="kpi"><small>Con retraso previsto</small><b style="color:${lateFc ? 'var(--bad)' : 'inherit'}">${lateFc}</b><small>su fin prevista es posterior a la planificada</small></div><div class="kpi"><small>Tareas completadas</small><b>${done.length} / ${all.length}</b></div><div class="kpi"><small>Entregadas a tiempo</small><b>${withReal ? Math.round((100 * onTime) / withReal) + '%' : '—'}</b><small>${onTime} de ${withReal} con fecha real</small></div><div class="kpi"><small>En riesgo ahora</small><b style="color:${risk.length ? 'var(--bad)' : 'inherit'}">${risk.length}</b><small>bloqueadas, vencidas o retrasadas</small></div><div class="kpi"><small>Esperando a otra tarea</small><b style="color:${blockedN ? 'var(--bad)' : 'inherit'}">${blockedN}</b><small>bloqueadas por dependencias</small></div><div class="kpi"><small>En sobrecarga (4 semanas)</small><b style="color:${overloaded().length ? 'var(--bad)' : 'inherit'}">${overloaded().length}</b><small>${
    overloaded()
      .map((m) => esc(m.name))
      .join(', ') || 'nadie por encima del 100%'
  }</small></div><div class="kpi"><small>No planificadas</small><b>${found}</b><small>detectadas, incidencias o cambios (${all.length ? Math.round((100 * found) / all.length) : 0}%)</small></div>`;
  if (!ME.owner) {
    return (
      chips +
      `<span class="hint">Las evaluaciones de calidad solo las ve el project manager.</span></div><div class="kpis">${commonK}</div><div class="grid2">${blocksCard(all)}${riskCard}</div>`
    );
  }
  const ev = done.map((t) => ({ t, s: score(t) })).filter((x) => x.s);
  const gi = avg(ev.map((x) => x.s.total));
  const lv = level(gi);
  const w = weights();
  let h =
    chips +
    `<span class="hint">🔒 Solo tú (PM) ves esta sección de evaluación. Índice = Plazo ${w.plazo}% · Calidad ${w.calidad}% · Alcance ${w.alcance}% · Retrabajo ${w.retrabajo}%</span></div>`;
  h += `<div class="kpis"><div class="kpi"><small>Índice de calidad de cumplimiento 🔒</small><b>${gi == null ? '—' : Math.round(gi)}</b><span class="tag ${lv.c}">${lv.t}</span> <small>${ev.length} evaluadas</small></div>${commonK}</div>`;
  const row = (label, ts) => {
    const d = ts.filter((t) => t.status === 'done');
    const e = d.map((t) => score(t)).filter(Boolean);
    const g = avg(e.map((s) => s.total));
    const l = level(g);
    const rk = ts.filter(atRisk).length;
    return `<tr><td>${label}</td><td>${d.length}/${ts.length}</td><td>${pct(avg(e.map((s) => s.plazo)))}</td><td>${pct(avg(e.map((s) => s.calidad)))}</td><td>${pct(avg(e.map((s) => s.alcance)))}</td><td>${pct(avg(e.map((s) => s.retrabajo)))}</td><td>${rk || ''}</td><td><b>${g == null ? '—' : Math.round(g)}</b> <span class="tag ${l.c}">${l.t}</span></td></tr>`;
  };
  const th = `<thead><tr><th></th><th>Hechas</th><th>Plazo</th><th>Calidad</th><th>Alcance</th><th>Retrabajo</th><th>En riesgo</th><th>Índice</th></tr></thead>`;
  h += `<div class="grid2"><div class="card" style="overflow:auto"><h3>Por miembro del equipo 🔒</h3><table>${th}<tbody>${members()
    .map((m) =>
      row(
        who(m.id),
        all.filter((t) => t.assigneeId === m.id),
      ),
    )
    .join('')}</tbody></table></div>`;
  h += `<div class="card" style="overflow:auto"><h3>Por proyecto 🔒</h3><table>${th}<tbody>${projects()
    .filter((p) => UI.proj.size === 0 || UI.proj.has(p.id))
    .map((p) =>
      row(
        `<span class="who"><span class="dot" style="background:${esc(p.color || '#98a2b3')}"></span>${esc(p.code || p.name)}</span>`,
        all.filter((t) => t.projectId === p.id),
      ),
    )
    .join('')}</tbody></table></div></div>`;
  const pend = done.filter((t) => !score(t));
  h += `<div class="grid2" style="margin-top:14px">${blocksCard(all)}${riskCard}</div>`;
  h += `<div class="grid2" style="margin-top:14px"><div class="card"><h3>Completadas pendientes de evaluar (${pend.length})</h3>${pend.length ? pend.map((t) => `<div class="list-row"><span style="flex:1">${esc(t.name)} <span class="mut">· ${esc(S.projects[t.projectId]?.code || '')}</span></span>${who(t.assigneeId, true)}<button class="btn sm" data-task="${t.id}">Evaluar</button></div>`).join('') : '<div class="hint">Todo evaluado.</div>'}</div><div></div></div>`;
  h += `<div class="card" style="margin-top:14px;overflow:auto"><h3>Detalle de tareas evaluadas 🔒</h3>${
    ev.length
      ? `<table><thead><tr><th>Tarea</th><th>Responsable</th><th>Retraso</th><th>Plazo</th><th>Calidad</th><th>Alcance</th><th>Retrabajo</th><th>Índice</th><th>Comentario</th></tr></thead><tbody>${ev
          .sort((a, b) => a.s.total - b.s.total)
          .map(({ t, s }) => {
            const l = level(s.total);
            const e = S.evals[t.id];
            return `<tr class="click" data-task="${t.id}"><td>${esc(t.name)}</td><td>${who(t.assigneeId)}</td><td>${s.late ? s.late + ' d' : '—'}</td><td>${pct(s.plazo)}</td><td>${'★'.repeat(e.quality)}<span style="color:#d0d5dd">${'★'.repeat(5 - e.quality)}</span></td><td>${pct(s.alcance)}</td><td>${e.rework || 0}</td><td><b>${Math.round(s.total)}</b> <span class="tag ${l.c}">${l.t}</span></td><td class="mut">${esc(e.notes || '')}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : '<div class="hint">Cuando una tarea se completa, evalúala desde su ficha: calidad (1–5), alcance entregado y nº de retrabajos. El plazo se calcula a partir de la fecha real de fin.</div>'
  }</div>`;
  return h;
}

/* ---------- vista: ausencias y festivos ---------- */
function vAusencias() {
  const y = UI.year,
    ys = dn(y + '-01-01'),
    ye = dn(y + 1 + '-01-01') - 1,
    ms = members().filter((m) => inTeam(m, y + '-01-01'));
  let h =
    `<div class="bar-tools"><button class="btn" id="yPrev">‹</button><b style="font-size:14px">${y}</b><button class="btn" id="yNext">›</button><select id="aMem"><option value="">Todo el equipo</option>${ms.map((m) => `<option value="${m.id}" ${UI.member === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select><span class="sp"></span>${ME.memberId ? '<button class="btn pri" id="addAbs">+ Ausencia</button><button class="btn" id="addExt" title="Un día que alguien trabaja fuera de su jornada: sábado, domingo, festivo o día libre">+ Jornada extra</button>' : ''}${ME.owner ? '<button class="btn" id="impHol">Importar festivos (BOCM)</button><button class="btn" id="addHol">+ Festivo</button>' : ''}</div>` +
    gapsNote();
  const list = arr('absences')
    .filter((a) => a.start <= iso(ye) && a.end >= iso(ys) && (!UI.member || a.memberId === UI.member))
    .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  h += `<div class="grid2"><div class="card" style="overflow:auto"><h3>Ausencias ${y}</h3>${
    list.length
      ? `<table><thead><tr><th>Persona</th><th>Tipo</th><th>Desde</th><th>Hasta / horario</th><th>Días lab.</th><th>Disponible</th><th>Nota</th></tr></thead><tbody>${list
          .map((a) => {
            const s = Math.max(dn(a.start), ys),
              e = Math.min(dn(a.end), ye);
            return `<tr class="click" data-abs="${a.id}"><td>${who(a.memberId)}</td><td><span class="tag mut" style="border-left:3px solid ${ABS[a.type]?.c || '#667085'}">${esc(absLabel(a))}</span></td><td>${fmt(a.start)}</td><td>${absHours(a) ? a.fromTime + '–' + a.toTime : fmt(a.end)}</td><td>${absHours(a) ? nf1(absHours(a)) + ' h' : workDays(a.memberId, s, e)}</td><td>${absPrivate(a) ? '—' : Math.round(absAvail(a) * 100) + '%'}</td><td class="mut">${absPrivate(a) ? '' : esc(a.note || '')}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : '<div class="hint">Sin ausencias registradas en este año.</div>'
  }</div>`;
  const cols = [
    ['vac', 'Vacaciones'],
    ['viaje', 'Viajes'],
    ['congreso', 'Congresos'],
    ['otras', 'Otras'],
  ];
  h += `<div class="card" style="overflow:auto"><h3>Días laborables de ausencia por persona · ${y}</h3><table><thead><tr><th>Persona</th>${cols.map((c) => `<th style="text-align:center">${c[1]}</th>`).join('')}<th style="text-align:center">Total</th></tr></thead><tbody>${ms
    .map((m) => {
      const c = { vac: 0, viaje: 0, congreso: 0, otras: 0 };
      for (const a of absOf(m.id)) {
        const s = Math.max(a.s, ys),
          e = Math.min(a.e, ye);
        if (e < s) continue;
        const k = ['vac', 'viaje', 'congreso'].includes(a.type) ? a.type : 'otras';
        // an absence by hours counts as the fraction of the working day it takes
        c[k] += workDays(m.id, s, e) * (absHours(a) ? Math.min(1, absHours(a) / capOf(m.id)) : 1);
      }
      for (const k in c) c[k] = Math.round(c[k] * 100) / 100;
      const tot = Math.round((c.vac + c.viaje + c.congreso + c.otras) * 100) / 100;
      return `<tr><td>${who(m.id, true)} ${esc(String(m.name || '').split(' ')[0])}</td>${cols.map((k) => `<td style="text-align:center">${c[k[0]] || '<span class="mut">0</span>'}</td>`).join('')}<td style="text-align:center"><b>${tot}</b></td></tr>`;
    })
    .join(
      '',
    )}</tbody></table><p class="hint">Cuenta solo días laborables: no incluye fines de semana ni festivos.</p></div></div>`;
  const hol = arr('holidays')
    .filter((x) => (x.date || '').startsWith(String(y)))
    .sort((a, b) => a.date.localeCompare(b.date));
  const DW = LAx(
    ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'],
    ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
  );
  {
    const xs = arr('extras')
      .filter((x) => (x.date || '').startsWith(String(y)) && (!UI.member || x.memberId === UI.member))
      .sort((a, b) => a.date.localeCompare(b.date));

  mayo: 5,
  junio: 6,
  julio: 7,
  agosto: 8,

  setiembre: 9,
  octubre: 10,
  noviembre: 11,
  diciembre: 12,

      .replace(/^./, (c) => c.toUpperCase());

    found = new Set();
  const body = t.replace(/\r/g, '').replace(/\n(?![—–\-•])/g, ' ');
  const re = /[—–\-•]\s*([A-ZÁÉÍÓÚÑÜ][^:—–\n]{1,70}?)\s*:\s*([^—–\n]{3,120}?)\.(?=\s|$)/g;
  let m;
  const want = {};
  for (const x of munis) want[norm(x)] = x;
  while ((m = re.exec(body))) {
    const muni = m[1].replace(/\s+/g, ' ').trim();
    const key = norm(muni);
    if (!want[key]) continue;
    found.add(want[key]);
    const toks = m[2]
      .split(/\s*,\s*|\s+y\s+/i)
      .map((x) => x.trim())
      .filter(Boolean);
    let month = null;
    const ds = [];
    for (let k = toks.length - 1; k >= 0; k--) {
      const mm = /(\d{1,2})(?:\s+de\s+(\w+))?/i.exec(toks[k]);
      if (!mm) continue;
      if (mm[2] && MESES[mm[2].toLowerCase()]) month = MESES[mm[2].toLowerCase()];
      if (month) ds.unshift(pad2(month) + '-' + pad2(+mm[1]));
    }
    for (const md of ds) {
      const nm = (LOCAL_NAMES[key] || {})[md] || 'Fiesta local de ' + want[key];
      out.push({
        date: year + '-' + md,
        name: nm,
        scope: 'local',
        municipality: want[key],
        fixed: !!(LOCAL_NAMES[key] || {})[md],
      });
    }
  }
  return { list: out, found: [...found], missing: munis.filter((x) => !found.has(x)) };
}
async function pdfToText(file) {
  if (!window.pdfjsLib) {
    await new Promise((ok, ko) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = ok;
      sc.onerror = () => ko(new Error('sin conexión'));
      document.head.appendChild(sc);
    });
    try {
      const w = await (
        await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')
      ).text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(
        new Blob([w], { type: 'text/javascript' }),
      );
    } catch (e) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  }
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let txt = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const c = await (await pdf.getPage(i)).getTextContent();
    for (const it of c.items) {
      txt += it.str + (it.hasEOL ? '\n' : ' ');
    }
    txt += '\n';
  }
  return txt;
}

      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn pri" id="hpSave">Guardar festivos</button></div>`;
    $('#hpSave').onclick = async () => {
      const url = val('hpU');
      const items = [];
      $('#hpRes')
        .querySelectorAll('input[data-h]:checked')
        .forEach((c) => {
          const i = +c.dataset.h,
            h = { ...found[i], scope: $('#hpRes').querySelector(`[data-sc="${i}"]`).value };

          items.push([

      const dels = [...$('#hpRes').querySelectorAll('input[data-del]:checked')].map((c) => c.dataset.del);
      if (!items.length && !dels.length) {

      for (const d of dels) await del('holidays', d);
      closeDlg();
      UI.year = year;
      toast(
        `Guardados ${items.length} festivo(s) de ${year}${dels.length ? ` y borrados ${dels.length}` : ''}.`,
      );
      render();
    };

}
// Aviso anual: qué festivos faltan para este año y, desde octubre, para el siguiente.
function holidayGaps() {
  const now = new Date(),
    Y = now.getFullYear(),
    years = [Y].concat(now.getMonth() >= 9 ? [Y + 1] : []),
    gaps = [];
  for (const y of years) {
    const ys = String(y),
      reg = arr('holidays').filter(
        (h) => h.date.startsWith(ys) && (h.scope === 'nacional' || h.scope === 'comunidad'),
      ).length;
    if (reg < 12)
      gaps.push({
        y,
        kind: 'reg',
        n: reg,
        text: `${y}: ${reg ? `solo ${reg} de 12` : 'ninguno de los 12'} festivos nacionales y autonómicos`,
        when: 'el decreto de la Comunidad de Madrid se publica en el BOCM hacia finales de septiembre del año anterior',
      });
    for (const c of centers()) {
      const nl = arr('holidays').filter(
        (h) => h.date.startsWith(ys) && h.scope === 'local' && norm(holMuni(h)) === norm(c.municipality),
      ).length;
      if (nl < 2 && (y === Y || now.getMonth() >= 11))
        gaps.push({
          y,
          kind: 'loc',
          n: nl,
          text: `${y}: ${nl} de 2 festivos locales de ${c.municipality}`,
          when: 'la resolución de fiestas locales sale en el BOCM en diciembre; Madrid capital las aprueba antes, en el Pleno de finales de septiembre',
        });
    }
  }
  return gaps;
}
function gapsNote() {
  const g = holidayGaps();
  if (!g.length) return '';
  return `<div class="note warn" style="margin-bottom:12px">📅 <b>Faltan festivos oficiales:</b><ul style="margin:4px 0 4px 18px;padding:0">${g.map((x) => `<li>${esc(x.text)} <span class="mut">(${esc(x.when)})</span></li>`).join('')}</ul>${ME.owner ? 'Pulsa <b>Importar festivos (BOCM)</b> en la pestaña Ausencias.' : 'Avisa al project manager.'}</div>`;
}

async function copyHolidays() {
  const y = UI.year,
    next = y + 1;
  const src = arr('holidays').filter((x) => x.fixed && (x.date || '').startsWith(String(y)));
  const have = new Set(
    arr('holidays')
      .filter((x) => (x.date || '').startsWith(String(next)))
      .map((x) => x.date.slice(5) + '|' + x.name),
  );
  let n = 0;
  for (const x of src) {
    const md = x.date.slice(5);
    if (have.has(md + '|' + x.name)) continue;
    const o = { ...x, date: next + '-' + md, source: '', sourceName: '', copiedFrom: x.date };
    delete o.id;
    if (await save('holidays', null, o)) n++;
  }
  toast(
    n
      ? `Copiados ${n} festivos a ${next}. Revisa Semana Santa, traslados y fiestas locales cuando se publique el calendario oficial.`
      : `No había festivos nuevos que copiar a ${next}.`,
  );
}

/* ---------- modales ---------- */
function openDlg(title, body, onSave, onDel, editable = true) {
  $('#dlg').innerHTML =
    `<h2>${title}</h2><div class="body">${body}</div><div class="foot">${onDel && editable ? '<button class="btn dang" id="mDel">Eliminar</button>' : ''}<span class="sp"></span><button class="btn" id="mCancel">${editable ? 'Cancelar' : 'Cerrar'}</button>${editable && onSave ? '<button class="btn pri" id="mSave">Guardar</button>' : ''}</div>`;
  $('#modal').classList.add('show');
  $('#mCancel').onclick = closeDlg;
  if ($('#mSave'))
    $('#mSave').onclick = async () => {
      const b = $('#mSave');
      b.disabled = true;
      const ok = await onSave();
      b.disabled = false;
      if (ok !== false) closeDlg();
    };
  const d = $('#mDel');
  if (d)
    d.onclick = () => {
      if (d.classList.contains('arm')) {
        onDel();
        closeDlg();
      } else {
        d.classList.add('arm');
        d.textContent = '¿Seguro? Pulsa otra vez';
        setTimeout(() => {
          d.classList.remove('arm');
          d.textContent = 'Eliminar';
        }, 3000);
      }
    };
  if (!editable)
    $('#dlg')
      .querySelectorAll('input,select,textarea,.stars button,.dep .x')
      .forEach((e) => (e.disabled = true));
}
function closeDlg() {
  $('#modal').classList.remove('show');
  $('#dlg').style.width = '';
  if (pendingRender) render();
}
$('#modal').addEventListener('mousedown', (e) => {
  if (e.target.id === 'modal') closeDlg();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDlg();
});

    if (pzForm === 'edit') {

    }
    const rows = H.map(

        `<tr><td>${i + 1}</td><td>${e.k === 'pause' ? '⏸ Pausa' : '✕ Cancelación'}</td><td>${fmt(e.from)}</td><td>${e.to ? fmt(e.to) : '<i>en curso</i>'}</td><td>${e.to ? gapWork(aid, e.from, e.to) : gapWork(aid, e.from, todayS())}</td><td>${esc(e.why || '')}${e.note ? ' <span class="mut">· ' + esc(e.note) + '</span>' : ''}${e.grp ? ' <span class="mut" title="Registrado al pausar o cancelar el proyecto">· proyecto</span>' : ''}</td><td style="white-space:nowrap">${e.endBefore && e.endAfter ? fmt(e.endBefore).slice(0, 8) + ' → ' + fmt(e.endAfter).slice(0, 8) : '—'}</td><td>${editable && i === H.length - 1 && !pzForm ? '<button type="button" class="x" data-pzx="editlast" title="Corregir">✎</button>' : ''}</td></tr>`,
    ).join('');
    const tot = H.filter((e) => e.to);

    box.querySelectorAll('[data-pza]').forEach(
      (b) =>
        (b.onclick = () => {
          pzForm = b.dataset.pza;
          renderPz();

    );
    if ($('#tHo')) $('#tHo').onclick = () => openHandover(id);
    const calc = () => {
      if (!$('#pzE')) return;

      $('#pzN').textContent = n;
      $('#pzE').value = iso(addWork(aid, dn(val('tE')), n));
    };
    if (pzForm === 'resume' && op) {
      calc();
      $('#pzD').onchange = calc;
      $('#pzR').onclick = calc;
    }
    box.querySelectorAll('[data-pzx]').forEach(
      (b) =>
        (b.onclick = () => {
          const a = b.dataset.pzx;
          if (a === 'close') {

            return;
          }
          if (a === 'editlast') {
            pzForm = 'edit';
            renderPz();
            return;
          }
          const last = H[H.length - 1];
          if (a === 'del') {
            if (last.to) {
              last.to = '';
              if (last.endBefore) {
                $('#tE').value = last.endBefore;

              delete last.endAfter;
              delete last.note;
            } else H.pop();
            pzForm = null;
            renderPz();
            upd();
            return;
          }
          if (pzForm === 'pause' || pzForm === 'cancel') {
            const d = val('pzD');
            if (!d) {

          } else if (pzForm === 'resume') {

  };
  const collect = () => {
    const status = val('tSt');

    let realEnd = val('tRE');
    if (status === 'done') {
      progress = 100;
      if (!realEnd) realEnd = todayS();
    }
    const o = {
      projectId: val('tProj'),
      name: val('tName'),
      assigneeId: ME.owner ? val('tAs') : t.assigneeId,
      origin: val('tOrig'),
      priority: val('tPri'),
      detectedBy: val('tDetBy'),
      detectedOn: val('tDetOn'),

      status,

      deps: [...deps],
      forceStart: ME.owner && $('#tForce') ? $('#tForce').checked : !!t.forceStart,
      blockReason: status === 'blocked' ? val('tBR') : '',
      dedication: Math.min(100, Math.max(5, +$('#tDed').value || 100)),

    if (o.origin === 'plan') {

      delete o.detectedOn;
    }
    if (H.length || t.hist) o.hist = H;
    return o;
  };
  const evCollect = () =>
    q
      ? {
          quality: q,
          scope: +$('#tSc').value,
          rework: +$('#tRw').value,
          by: 'PM',
          notes: $('#tEvN').value,
          at: ev.at || todayS(),
        }
      : null;
  const upd = () => {
    const c = cur();
    const bl = deps.map(tk).filter((p) => p && p.status !== 'done');
    const blocked = c.status !== 'done' && bl.length > 0 && !c.forceStart;
    let n = '';
    if (bl.length && c.status !== 'done')
      n += `<div class="note ${blocked ? 'bad' : 'info'}">${blocked ? '⛔ <b>Bloqueada:</b> no se puede avanzar ni completar hasta que terminen ' : 'Avance permitido por el PM aunque siguen pendientes '}${bl.map((p) => `<b>${esc(p.name)}</b> (${esc(mem(p.assigneeId)?.name || 'sin asignar')})`).join(', ')}.${ME.owner ? `<label style="flex-direction:row;align-items:center;gap:6px;margin-top:6px;font-weight:500"><input type="checkbox" id="tForce" ${c.forceStart ? 'checked' : ''} style="width:auto"> Permitir avanzar igualmente (decisión del PM)</label>` : ''}</div>`;
    const cf = dateConflict(c);
    if (cf && c.status !== 'done')
      n += `<div class="note warn">📅 Empieza antes de que termine aquello de lo que depende. Inicio más temprano coherente: <b>${fmt(cf)}</b>. ${editable && planOK ? `<button type="button" class="btn sm" id="tFix">Mover la tarea a esa fecha</button>` : ''}</div>`;
    {
      const pp = S.projects[val('tProj')];
      const pe = pp && pp.end;
      if (pe && c.status !== 'done' && c.end && c.end > pe)
        n += `<div class="note warn">📅 El fin planificado (<b>${fmt(c.end)}</b>) es posterior al fin objetivo del proyecto «${esc(pp.name)}» (<b>${fmt(pe)}</b>). Puedes guardarla igualmente; aparecerá como «Fuera del plazo del proyecto» y en los avisos 🔔.</div>`;
    }
    $('#tBlk').innerHTML = n;
    const fc = $('#tForce');
    if (fc) fc.onchange = upd;
    const fx = $('#tFix');
    if (fx)
      fx.onclick = () => {
        const d = dn(val('tE')) - dn(val('tS'));
        $('#tS').value = cf;
        $('#tE').value = iso(dn(cf) + d);
        upd();
      };
    const P = $('#tP'),
      ST = $('#tSt');
    if (editable) {
      P.disabled = blocked;
      ST.querySelector('option[value=done]').disabled = blocked;
      ST.querySelector('option[value=doing]').disabled = blocked;
    }
    $('#tBRw').style.display = c.status === 'blocked' ? '' : 'none';
    {
      const o = collect();
      const aid = o.assigneeId;
      const cap = capOf(aid);
      $('#tDedH').textContent = aid
        ? `≈ ${((cap * o.dedication) / 100).toFixed(1)} h/día de ${cap} h disponibles`
        : '';
      let ln = '';

        ).filter((w) => w.start + 4 >= s && w.start <= e);
        const pk = wk.reduce((a, w) => (w.avg > a.avg ? w : a), { avg: 0 });
        if (pk.avg > 100)
          ln = `<div class="note bad">⚠ Con esta tarea, <b>${esc(mem(aid)?.name)}</b> queda en <b>sobrecarga</b>: ${fmtPct(pk.avg)} de sus horas disponibles la semana del ${fmt(iso(pk.start))}. Reduce la dedicación, mueve fechas o reasigna.</div>`;
        else if (pk.avg >= 85)
          ln = `<div class="note warn">Con esta tarea, ${esc(mem(aid)?.name)} queda al límite (${fmtPct(pk.avg)} la semana del ${fmt(iso(pk.start))}).</div>`;
      }
      if (aid && o.start && o.end && o.status !== 'done') {
        const s = dn(o.start),
          e = dn(o.end);
        const ov = absOverlap(aid, s, e);

          ln += `<div class="note warn">🗓 ${esc(mem(aid)?.name)} estará ausente durante la tarea: ${ov.map((x) => `<b>${esc(absLabel(x))}</b> ${absWhen(x)}${!absHours(x) && x.availability > 0 ? ` (disponible ${x.availability}%)` : ''}`).join(', ')}.</div>`;
        const hs = holOn(aid, s),
          he = holOn(aid, e);
        if (hs.length || he.length || !isWork(s) || !isWork(e))
          ln += `<div class="note info">${!isWorkM(aid, s) ? `La tarea empieza en un día no laborable (${fmt(o.start)}${hs.length ? ' · ' + esc(hs.map((x) => x.name).join(', ')) : ''}). ` : ''}${!isWorkM(aid, e) ? `Termina en un día no laborable (${fmt(o.end)}${he.length ? ' · ' + esc(he.map((x) => x.name).join(', ')) : ''}).` : ''}</div>`;

      {
        const o2 = { ...o, id: id || '__new' };

        if (o2.status === 'done' || !aid || !o2.start || !o2.end) {

            f.end == null
              ? `<div class="note warn">Sin fecha prevista: ${esc(f.why || '')}.</div>`
              : `<div class="note ${f.slip > 0 ? 'bad' : 'info'}">📅 <b>Fin prevista: ${fmt(iso(f.end))}</b> ${f.slip > 0 ? `· <b>${f.slip} días laborables después</b> de la fin planificada (${fmt(o2.end)})` : f.slip < 0 ? `· ${-f.slip} días laborables antes de lo planificado` : '· coincide con la fin planificada'}<br><span style="font-size:12px">Quedan ≈ ${rh} h de ${Math.round(estHours(o2))} h estimadas${(f.reasons || []).length ? ' · Influye: ' + esc(f.reasons.join(' · ')) : ''}. Cálculo con su calendario (festivos de su centro y ausencias), sus reuniones y sus otras tareas: primero las de prioridad alta.</span></div>`;
        }
      }
    }

    const o = { ...collect() };
    const s = score(o, evCollect());
    const box = $('#tScore');
    if (!s) {
      box.innerHTML = `<span class="hint">${o.status === 'done' ? 'Valora la calidad (★) para calcular el índice.' : 'El índice se calcula cuando la tarea está completada y valorada.'}</span>`;
      return;
    }
    const l = level(s.total);
    box.innerHTML = `<div>Índice<br><b>${Math.round(s.total)}</b> <span class="tag ${l.c}">${l.t}</span></div><div class="hint">Plazo ${pct(s.plazo)}${s.late ? ` (${s.late} d de retraso)` : ''}<br>Calidad ${pct(s.calidad)} · Alcance ${pct(s.alcance)} · Retrabajo ${pct(s.retrabajo)}</div>`;
  };
  openDlg(
    id ? (editable ? 'Editar tarea' : 'Tarea (solo lectura)') : 'Nueva tarea',
    body,
    async () => {
      const o = collect();

      if (!planOK && id) for (const k of PLAN_FIELDS) if (S.tasks[id][k] !== undefined) o[k] = S.tasks[id][k];
      if (!o.name) {
        toast('Ponle un nombre a la tarea.');
        return false;
      }
      if (!o.start || !o.end || o.end < o.start) {
        toast('Revisa las fechas planificadas.');
        return false;
      }
      const bl = o.deps.map(tk).filter((p) => p && p.status !== 'done');

        bl.length &&

        !(id && S.tasks[id].status === o.status)

            '»: está bloqueada por ' +
            bl.map((p) => p.name).join(', ') +

    },
    id && planOK ? () => delTask(id) : null,

  );

    );
    $('#dlg .body').insertAdjacentHTML(
      'afterbegin',
      '<div class="note info full">La planificación de la tarea la cambia el project manager. Tú puedes actualizar el estado, el avance, las horas pendientes, las fechas reales y el motivo de un bloqueo.</div>',
    );
  }

  $('#tSt').addEventListener('change', renderPz);

    if (!plan && !val('tDetOn') && editable) $('#tDetOn').value = todayS();
  };
  $('#tOrig').onchange = detToggle;
  detToggle();
  $('#tAs').addEventListener('change', () => upd());
  {
    const pvS = () => {
      const pv = !!S.projects[val('tProj')]?.priv;
      const a = $('#tAs');
      if (pv) {
        if (myMemberId()) a.value = myMemberId();
        a.disabled = true;
      } else a.disabled = !ME.owner || !editable;
      let n = $('#tPvN');
      if (pv && !n) {
        n = document.createElement('div');
        n.id = 'tPvN';
        n.className = 'full note info';
        n.innerHTML =
          '🔒 <b>Proyecto privado</b>: solo tú ves esta tarea. Su fecha prevista se calcula con tu calendario privado (' +
          privH() +
          ' h/día, todos los días) y no cuenta en tu carga laboral.';
        $('#tName').closest('label').after(n);
      } else if (!pv && n) n.remove();
      upd();

    pvS();

    $('#tPv').textContent = $('#tP').value + '%';
    upd();
  };
  if (ME.owner) {
    const qd = (v) => {
      $('#tQd').innerHTML = v
        ? `<b>${v} ★ · ${RLBL[v - 1]}:</b> ${esc(rubric()[v - 1])}`
        : 'Elige de 1 a 5 estrellas según la escala.';
    };

    $('#tQ')
      .querySelectorAll('button')
      .forEach((b) => {
        b.onclick = () => {
          q = +b.dataset.q;
          $('#tQ')
            .querySelectorAll('button')
            .forEach((x) => x.classList.toggle('on', +x.dataset.q <= q));

          upd();
        };
        b.onmouseenter = () => qd(+b.dataset.q);
        b.onmouseleave = () => qd(q);
      });
  }
  $('#tSt').onchange = () => {
    if (val('tSt') === 'done') {
      $('#tP').value = 100;
      $('#tPv').textContent = '100%';
      if (!val('tRE')) $('#tRE').value = todayS();
    }
    upd();
  };
