    .concat(ME.owner ? ['tSc', 'tRw'] : [])
    .forEach((i) => $('#' + i).addEventListener('input', upd));
  upd();
}
function openMeeting(id, defs = {}) {
  const me = myMemberId();
  const occ = id && String(id).startsWith('rs-') ? S.meetings[id] : null;
  const sr = occ ? SERIES[occ.seriesId] : null;
  const m = id
    ? { ...S.meetings[id] }
    : {
        date: todayS(),
        time: '10:00',
        duration: 60,
        type: 'seguimiento',
        attendees: [
          ...new Set([
            ...activeMembers()
              .filter((x) => x.isPM)
              .map((x) => x.id),
            ...(me ? [me] : []),
          ]),
        ],
        ...defs,
      };
  const editable = canEditMeeting(id ? m : null);
  const tbm = m.source === 'thunderbird';
  let att = new Set(m.attendees || []);
  const rp = sr ? { ...sr.repeat } : { freq: '', days: [], until: '', skipHol: true };
  const days = new Set(rp.days || []);
  const FIELDS = ['title', 'type', 'projectId', 'date', 'time', 'duration', 'notes'];
  const body = `${
    occ
      ? `<div class="full note info" style="margin:0">↻ Reunión periódica: <b>${esc(repeatLbl(sr?.repeat))}</b> desde el ${fmt(sr?.date)}${sr?.repeat?.until ? ' hasta el ' + fmt(sr.repeat.until) : ' (sin fecha de fin)'} · ${{ list: 'asistentes elegidos', team: 'todo el equipo', project: 'participantes del proyecto' }[sr?.attMode || 'list']}.</div>
   <label class="full">Aplicar los cambios a<select id="mScope"><option value="one">Solo esta reunión (${fmt(occ.occDate)})</option><option value="next">Esta y las siguientes</option><option value="all">Toda la serie</option></select></label>`
      : ''
  }
   <label class="full">Título<input type="text" id="mT" value="${esc(m.title)}"></label>
   <label>Tipo<select id="mTy">${opt(Object.entries(MTYPE), m.type)}</select></label>
   <label>Proyecto<select id="mP">${opt(
     projects()
       .filter((p) => !p.priv)
       .map((p) => [p.id, p.name]),
     m.projectId,
     'General (varios proyectos)',
   )}</select></label>
   <label>Fecha<input type="date" id="mD" value="${esc(m.date)}"></label>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Hora de inicio<input type="time" id="mH" value="${esc(m.time || '')}"></label><label>Hora de fin<input type="time" id="mF" value="${endTime(m.time, m.duration)}"></label></div>
   ${
     tbm
       ? ''
       : `<div class="full" id="mRp" style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px">
     <label>Repetir<select id="mRe">${opt(REPEAT, rp.freq || '')}</select></label>
     <label>Hasta (opcional)<input type="date" id="mUn" value="${esc(rp.until || '')}"></label>
     <div class="full" id="mDw" style="display:none"><div style="font-weight:500;font-size:12px;color:#344054;margin-bottom:6px">Días</div><div style="display:flex;gap:6px">${WDL.map((l, i) => `<span class="chip ${days.has(i) ? 'on' : ''}" data-wd="${i}" style="min-width:34px;justify-content:center">${l}</span>`).join('')}</div></div>
     <label class="full" id="mShL" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="mSh" ${rp.skipHol !== false ? 'checked' : ''} style="width:auto"> No ponerla en festivos de todo el equipo</label>
     <label class="full" id="mAmL">Asistentes de la serie<select id="mAm">${opt(ATTM, sr?.attMode || 'list')}</select></label>
     <div class="full hint" id="mAmH"></div></div>`
   }
   <div class="full"><div style="font-weight:500;font-size:12px;color:#344054;margin-bottom:6px;display:flex;align-items:center">Asistentes<span class="sp"></span>${editable ? '<button type="button" class="btn sm" id="mAP" title="Marca a todos los participantes del proyecto elegido">+ Participantes del proyecto</button>' : ''}</div><div id="mA" style="display:flex;gap:6px;flex-wrap:wrap">${
     pickMembers([...att], m.date)
       .map(
         (x) =>
           `<span class="chip ${att.has(x.id) ? 'on' : ''}" data-a="${x.id}">${who(x.id)}${x.isPM ? ' <span class="mut">PM</span>' : ''}</span>`,
       )
       .join('') || '<span class="hint">Añade miembros del equipo primero.</span>'
   }</div></div>
   <label class="full">Acuerdos / notas<textarea id="mN">${esc(m.notes)}</textarea></label>
   ${tbm ? '<div class="note info">📅 Convocatoria registrada desde <b>Thunderbird</b>. El título, la fecha, la hora y la duración se cambian allí; aquí puedes completar el tipo, el proyecto, los asistentes y las notas.</div>' : ''}
   ${id && !editable ? '<div class="note info">Solo quien registró la reunión o el PM pueden modificarla.</div>' : ''}`;
  const scope = () => (occ ? val('mScope') : null);
  const freq = () => ($('#mRe') && !(occ && scope() === 'one') ? val('mRe') : '');
  const mode = () => (freq() && $('#mAm') ? val('mAm') : 'list');
  const delSeries = async (sid) => {
    S.meetings[sid] = SERIES[sid];
    await del('meetings', sid);
  };
  openDlg(
    id ? (editable ? 'Editar reunión' : 'Reunión') : 'Nueva reunión',
    body,
    async () => {
      const o = {
        title: val('mT'),
        type: val('mTy'),
        projectId: val('mP'),
        date: val('mD'),
        time: val('mH'),
        duration: m.duration || 60,
        notes: $('#mN').value,
      };
      const h0 = hm2min(o.time),
        h1 = hm2min(val('mF'));
      if (!tbm && h0 != null && h1 != null) {
        if (h1 <= h0) {
          toast('La hora de fin debe ser posterior a la de inicio.');
          return false;
        }
        o.duration = h1 - h0;
      }
      if (!o.title || !o.date) {
        toast('Indica título y fecha.');
        return false;
      }
      const F = freq(),
        M = mode();
      if (M === 'list' && !att.size) {
        toast('Marca al menos un asistente: la reunión se muestra en la fila de cada asistente.');
        return false;
      }
      if (M === 'project' && !projPeople(S.projects[o.projectId]).length) {
        toast('El proyecto elegido no tiene participantes: elige otro modo de asistentes.');
        return false;
      }
      if (F && (F === 'weekly' || F === 'biweekly') && !days.size) days.add((dow(dn(o.date)) + 6) % 7);
      const rep = {
        freq: F,
        days: [...days].sort(),
        until: $('#mUn') ? val('mUn') : '',
        skipHol: $('#mSh') ? $('#mSh').checked : true,
      };
      if (rep.until && rep.until < o.date) {
        toast('La fecha «Hasta» es anterior al inicio.');
        return false;
      }
      const serie = (date, cb) => ({
        isSeries: true,
        ...o,
        date,
        repeat: rep,
        attMode: M,
        attendees: M === 'list' ? [...att] : [],
        createdBy: cb,
        updatedAt: new Date().toISOString(),
      });
      if (tbm) {
        const ov = {
          type: o.type,
          projectId: o.projectId,
          attendees: [...att],
          notes: o.notes,
          tbOverride: true,
          createdBy: m.createdBy,
        };
        if (!(await save('meetings', id, ov))) return false;
        return;
      }
      if (occ) {
        const sc = scope();
        if (sc === 'one') {
          const ov = { occOverride: true, createdBy: sr.createdBy };
          const was = S.meetings[id];
          for (const k of FIELDS) {
            if ((was.overridden || []).includes(k)) ov[k] = was[k];
            if (String(o[k] ?? '') !== String(was[k] ?? '')) ov[k] = o[k];
          }
          const a = [...att].sort().join(),
            b = [...(was.attendees || [])].sort().join();
          if ((was.overridden || []).includes('attendees') || a !== b) ov.attendees = [...att];
          if (!(await save('meetings', id, ov))) return false;
          return;
        }
        if (!F) {
          toast('Para dejar de repetir, elige «Solo esta reunión» o borra la serie.');
          return false;
        }
        if (sc === 'all' || occ.occDate === sr.date) {
          if (!(await save('meetings', occ.seriesId, serie(sc === 'all' ? sr.date : o.date, sr.createdBy))))
            return false;
          return;
        }
        await save('meetings', occ.seriesId, {
          ...sr,
          repeat: { ...sr.repeat, until: iso(dn(occ.occDate) - 1) },
        });
        if (!(await save('meetings', null, serie(o.date, sr.createdBy)))) return false;
        return;
      }
      if (F) {
        if (!(await save('meetings', null, serie(o.date, me || m.createdBy)))) return false;
        if (id) await del('meetings', id);
        toast('Reunión periódica creada.');
        return;
      }
      if (!(await save('meetings', id, { ...o, attendees: [...att], updatedAt: new Date().toISOString() })))
        return false;
    },
    id
      ? occ
        ? async () => {
            const sc = scope();
            if (sc === 'one')
              await save('meetings', id, { occOverride: true, hidden: true, createdBy: sr.createdBy });
            else if (sc === 'all' || occ.occDate === sr.date) await delSeries(occ.seriesId);
            else
              await save('meetings', occ.seriesId, {
                ...sr,
                repeat: { ...sr.repeat, until: iso(dn(occ.occDate) - 1) },
              });
          }
        : tbm
          ? () => save('meetings', id, { hidden: true, tbOverride: true, createdBy: m.createdBy })
          : () => del('meetings', id)
      : null,
    editable,
  );
  mdField($('#mN'));
  {
    let len = +m.duration || 60;
    const H = $('#mH'),
      F = $('#mF');
    if (H && F) {
      H.onchange = () => {
        if (hm2min(H.value) != null) F.value = min2hm(Math.min(1439, hm2min(H.value) + len));
      };
      F.onchange = () => {
        const a = hm2min(H.value),
          b = hm2min(F.value);
        if (a != null && b != null && b > a) len = b - a;
      };
    }
  }
  if (tbm) {
    ['mT', 'mD', 'mH', 'mF'].forEach((i) => ($('#' + i).disabled = true));
    const d = $('#mDel');
    if (d) d.textContent = 'Ocultar en la herramienta';
  }
  const paint = () =>
    $('#mA')
      .querySelectorAll('[data-a]')
      .forEach((c) => c.classList.toggle('on', att.has(c.dataset.a)));
  const sync = () => {
    const b = $('#mAP');
    if (b) {
      const pp = projPeople(S.projects[val('mP')]);
      b.disabled = !pp.length || mode() !== 'list';
      b.title = pp.length
        ? 'Marca a: ' + pp.map((x) => mem(x).name).join(', ')
        : 'El proyecto elegido no tiene participantes registrados';
    }
    const rpBox = $('#mRp');
    if (rpBox) {
      const showRp = !(occ && scope() === 'one');
      rpBox.style.display = showRp ? 'grid' : 'none';
      const F = freq();
      $('#mDw').style.display = F === 'weekly' || F === 'biweekly' ? 'block' : 'none';
      $('#mShL').style.display = F && F !== 'daily' ? 'flex' : 'none';
      $('#mAmL').style.display = F ? 'flex' : 'none';
      $('#mUn').disabled = !F;
      const M = mode(),
        h = $('#mAmH');
      if (M !== 'list') {
        att = new Set(seriesAtt({ attMode: M, projectId: val('mP') }, val('mD') || todayS()));
        paint();
        h.innerHTML =
          M === 'team'
            ? 'Asisten todas las personas del equipo. Quien se incorpore después entra solo en las reuniones a partir de su <b>fecha de incorporación</b>.'
            : 'Asisten los participantes del proyecto elegido. Si cambian los participantes, cambian los asistentes.';
        h.style.display = 'block';
      } else {
        h.style.display = 'none';
      }
      $('#mA').style.opacity = M !== 'list' ? '.6' : '1';
    }
  };
  $('#mA')
    .querySelectorAll('[data-a]')
    .forEach(
      (c) =>
        (c.onclick = () => {
          if (!editable || mode() !== 'list') return;
          const a = c.dataset.a;
          att.has(a) ? att.delete(a) : att.add(a);
          c.classList.toggle('on');
        }),
    );
  document.querySelectorAll('#mDw [data-wd]').forEach(
    (c) =>
      (c.onclick = () => {
        const k = +c.dataset.wd;
        days.has(k) ? days.delete(k) : days.add(k);
        c.classList.toggle('on');
      }),
  );
  for (const k of ['mP', 'mRe', 'mAm', 'mScope', 'mD'])
    if ($('#' + k)) $('#' + k).addEventListener('change', sync);
  sync();
  if ($('#mAP'))
    $('#mAP').onclick = () => {
      for (const x of projPeople(S.projects[val('mP')])) att.add(x);
      paint();
    };
}
function openProject(id) {
  if (!ME.owner) return;
  const p = id
    ? { ...S.projects[id] }
    : {
        color: PALETTE[Object.keys(S.projects).length % PALETTE.length],
        status: 'active',
        start: todayS(),
        ownerId: members().find((m) => m.isPM)?.id,
      };
  const parts = new Set([...(p.participants || []), ...(id && p.ownerId ? [p.ownerId] : [])]);
  const body = `<label class="full">Nombre<input type="text" id="pN" value="${esc(p.name)}"></label>
   <label>Código corto <span class="mut" style="font-weight:400">· automático</span><div style="display:flex;gap:4px"><input type="text" id="pC" value="${esc(p.code || '')}" placeholder="se genera con el nombre" style="flex:1"><button type="button" class="btn sm" id="pCa" title="Volver a generarlo a partir del nombre">↻</button></div></label>
   <label>Color<input type="color" id="pCo" value="${esc(p.color || '#2f5bea')}" style="height:34px;width:100%;border:1px solid var(--line);border-radius:7px"></label>
   <label>Responsable<select id="pO">${opt(
     pickMembers([p.ownerId]).map((m) => [m.id, m.name]),
     p.ownerId,
     '—',
   )}</select></label>
   <label>Estado<select id="pS">${opt(PSTATUS, p.status || 'active')}</select></label>
   ${ME.owner && EVKEY ? `<label class="full" style="flex-direction:row;align-items:center;gap:8px;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:8px 10px"><input type="checkbox" id="pPriv" ${p.priv ? 'checked' : ''} style="width:auto"> <span>🔒 <b>Privado (solo yo)</b> <span class="mut" style="font-weight:400">· el equipo no lo ve en ningún sitio; se guarda cifrado con tu contraseña. Sus tareas usan tu calendario privado (${privH()} h/día, todos los días) y no cuentan en tu jornada laboral.</span></span></label>` : ''}
   <label>Tipo<select id="pTy">${opt(
     ptypes().map((t) => [t.id, t.name]),
     ptypeOf(p.type) ? p.type : '',
     '— Sin tipo —',
   )}</select></label>
   <label>Programa / organismo<input type="text" id="pPg" value="${esc(p.program || '')}" placeholder="p. ej. Horizonte Europa, plan nacional de I+D…"></label>
   <label>Inicio<input type="date" id="pSt" value="${esc(p.start || '')}"></label>
   <label>Fin objetivo<input type="date" id="pE" value="${esc(p.end || '')}"></label>
   <div class="full" id="pPaW" style="${p.priv ? 'display:none' : ''}"><div style="font-weight:500;font-size:12px;color:#344054;margin-bottom:6px">Participantes del equipo <span class="mut" style="font-weight:400">(el responsable cuenta siempre como participante)</span></div><div id="pPa" style="display:flex;gap:6px;flex-wrap:wrap">${
     pickMembers([...parts])
       .map((x) => `<span class="chip ${parts.has(x.id) ? 'on' : ''}" data-pa="${x.id}">${who(x.id)}</span>`)
       .join('') || '<span class="hint">Añade miembros del equipo primero.</span>'
   }</div></div>
   <div class="full" id="pSx"></div>
   <label class="full">Descripción<textarea id="pD">${esc(p.description)}</textarea></label>`;
  openDlg(
    id ? 'Editar proyecto' : 'Nuevo proyecto',
    body,
    async () => {
      const prev = id ? S.projects[id]?.status || 'active' : 'active',
        nst = val('pS');
      const wasPriv = !!(id && S.projects[id]?.priv),
        isPriv = !!($('#pPriv') && $('#pPriv').checked);
      if (
        isPriv &&
        !wasPriv &&
        id &&
        arr('tasks').some((t) => t.projectId === id && t.assigneeId && t.assigneeId !== myMemberId())
      ) {
        toast('Para hacerlo privado, todas sus tareas deben estar asignadas a ti.');
        return false;
      }
      const o = {
        ...(id ? S.projects[id] : {}),
        name: val('pN'),
        code: (val('pC') || autoCode(val('pN'), id)).toUpperCase(),
        color: $('#pCo').value,
        ownerId: val('pO'),
        status: val('pS'),
        type: val('pTy'),
        program: val('pPg'),
        participants: [...parts].filter((x) => x !== val('pO')),
        start: val('pSt'),
        end: val('pE'),
        description: $('#pD').value,
      };
      delete o.id;
      const tItems = [];
      const PO = id ? projOpen(S.projects[id]) : null;
      if (id && prev !== nst) {
        const now = new Date().toISOString(),
          me_ = ME.memberId || 'pm';
        const T = (tid) => {
          const x = { ...S.tasks[tid] };
          delete x.id;
          x.hist = JSON.parse(JSON.stringify(hist(x)));
          return x;
        };
        const closeGrp = (date, ends) => {
          const out = [];
          for (const t of arr('tasks')) {
            const oe = openEv(t);
            if (!oe || !PO || oe.grp !== PO.grp) continue;
            const x = T(t.id);
            const l = x.hist[x.hist.length - 1];
            l.to = date;
            l.endBefore = x.end;
            l.endAfter = ends ? ends[t.id] || x.end : x.end;
            x.end = l.endAfter;
            out.push([t.id, x]);
          }
          return out;
        };
        o.hist = JSON.parse(JSON.stringify(o.hist || []));
        if (nst === 'paused') {
          if (prev === 'cancelled') {
            toast('Un proyecto cancelado se reactiva primero (estado «Activo»).');
            return false;
          }
          const from = val('pPzD') || todayS(),
            why = val('pPzW'),
            grp = 'pg-' + newId(),
            ids = [...document.querySelectorAll('#pSx [data-pz]:checked')]
              .map((c) => c.dataset.pz)
              .filter((x) => !openEv(S.tasks[x]));
          for (const tid of ids) {
            const x = T(tid);
            x.hist.push({ k: 'pause', from, to: '', why, grp, by: me_, at: now });
            tItems.push([tid, x]);
          }
          o.hist.push({ k: 'pause', from, to: '', why, grp, tasks: ids, by: me_, at: now });
        } else if (nst === 'cancelled') {
          const from = val('pCxD') || todayS(),
            why = val('pCxM'),
            grp = 'pg-' + newId();
          if (prev === 'paused' && PO) {
            for (const [tid, x] of closeGrp(from, null)) tItems.push([tid, x]);
            PO.to = from;
            const l = o.hist[o.hist.length - 1];
            if (l && !l.to) l.to = from;
          }
          const ids = [];
          for (const t of arr('tasks').filter((t) => t.projectId === id && t.status !== 'done')) {
            const ex = tItems.find((z) => z[0] === t.id);
            const x = ex ? ex[1] : T(t.id);
            if (!ex && openEv(t)) continue;
            x.hist.push({ k: 'cancel', from, to: '', why, grp, by: me_, at: now });
            if (!ex) tItems.push([t.id, x]);
            ids.push(t.id);
          }
          o.hist.push({ k: 'cancel', from, to: '', why, grp, tasks: ids, by: me_, at: now });
        } else if ((prev === 'paused' || prev === 'cancelled') && PO) {
          const date = val('pRsD') || todayS();
          if (date < PO.from) {
            toast('La fecha de reanudación no puede ser anterior al ' + fmt(PO.from) + '.');
            return false;
          }
          const ends = {};
          document.querySelectorAll('#pSx [data-rse]').forEach((inp) => (ends[inp.dataset.rse] = inp.value));
          for (const [tid, x] of closeGrp(date, ends)) tItems.push([tid, x]);
          const l = o.hist[o.hist.length - 1];
          if (l && !l.to) {
            l.to = date;
            if (val('pRsW')) l.note = val('pRsW');
          }
        }
      }
      delete o.pausedTasks;
      delete o.pausedAt;
      delete o.pauses;
      delete o.cancelledAt;
      delete o.cancelReason;
      if (isPriv) {
        o.priv = true;
        o.participants = [];
        o.ownerId = myMemberId() || o.ownerId;
      } else delete o.priv;
      if (!o.name) {
        toast('Ponle nombre al proyecto.');
        return false;
      }
      const pid_ = await save('projects', id, o);
      if (!pid_) return false;
      if (id && isPriv !== wasPriv) {
        const ts = isPriv
          ? arr('tasks').filter((t) => t.projectId === id && !t.priv)
          : Object.entries(PRDATA.tasks)
              .filter(([, t]) => t.projectId === id && !t._del)
              .map(([tid, t]) => ({ ...t, id: tid }));
        for (const t of ts) {
          const d = { ...t };
          delete d.id;
          delete d.priv;
          if (isPriv) d.assigneeId = myMemberId() || d.assigneeId;
          await save('tasks', t.id, d);
        }
        toast(
          isPriv
            ? `Proyecto privado: ${ts.length} tarea(s) pasan a ser privadas.`
            : `Proyecto público: ${ts.length} tarea(s) pasan a ser visibles para el equipo.`,
        );
      }
      if (tItems.length) {
        await saveMany('tasks', tItems);
        toast(tItems.length + ' tarea(s) actualizada(s).');
      }
    },
    id
      ? () => {
          if (arr('tasks').some((t) => t.projectId === id)) {
            toast('El proyecto tiene tareas: bórralas o muévelas antes.');
            return;
          }
          del('projects', id);
        }
      : null,
  );
  {
    const prevS = p.status || 'active',
      PO = id ? projOpen(p) : null;
    const sx = () => {
      const v = val('pS'),
        open = id
          ? arr('tasks')
              .filter((t) => t.projectId === id && t.status !== 'done')
              .sort((a, b) => String(a.start).localeCompare(String(b.start)))
          : [];
      let h = '';
      const histT = (p.hist || []).length

    }

      return false;
    }
    // new length of a meeting: from its (new) start time to the end time given

    };

      let at = new Set(x.attendees || []);
      for (const a of add) at.add(a);
      for (const r of rem) at.delete(r);
      if (!at.size) {
        empty++;
        continue;
      }
      const ch = { attendees: [...at] };
      if (P !== '__keep') ch.projectId = P;
      if (T !== '__keep') ch.type = T;
      const { id, ...cur } = x;
      if (x.seriesId) {
        const ov = { occOverride: true, createdBy: x.createdBy };
        for (const k of x.overridden || []) ov[k] = x[k];
        if (add.size || rem.size) ov.attendees = ch.attendees;
        if (P !== '__keep') ov.projectId = P;
        if (T !== '__keep') ov.type = T;
        if (H) ov.time = H;
        if (durOf(x)) ov.duration = durOf(x);
        items.push([id, ov]);
        continue;
      }
      if (x.source === 'thunderbird')
        items.push([
          id,
          {
            type: ch.type ?? x.type,
            projectId: ch.projectId ?? x.projectId,
            attendees: ch.attendees,
            notes: x.notes || '',
            tbOverride: true,
            createdBy: x.createdBy,
          },
        ]);
      else {
        if (H) ch.time = H;
        if (durOf(x)) ch.duration = durOf(x);
        items.push([
          id,
          { ...cur, ...ch, createdBy: x.createdBy || ME.memberId, updatedAt: new Date().toISOString() },
        ]);
      }
    }
    if (!items.length) {
      toast('Todas quedarían sin asistentes: no se ha cambiado nada.');
      return false;
    }
    await saveMany('meetings', items);
    UI.meetPick = new Set();
    UI.meetSel = false;
    render();
    toast(
      `${items.length} reunión(es) modificada(s).${empty ? ` ${empty} no se tocaron porque quedarían sin asistentes.` : ''}`,
    );
  });
  const sum = () => {
    const a = [...add].map((x) => mem(x).name),
      r = [...rem].map((x) => mem(x).name);
    $('#bSum').innerHTML =
      (a.length ? `Se añade a <b>${esc(a.join(', '))}</b>. ` : '') +
      (r.length ? `Se quita a <b>${esc(r.join(', '))}</b>.` : '');
  };
  $('#bA')
    .querySelectorAll('[data-ba]')
    .forEach(
      (c) =>
        (c.onclick = () => {
          const k = c.dataset.ba;
          if (add.has(k)) add.delete(k);
          else {
            add.add(k);
            rem.delete(k);
            $(`#bR [data-br="${k}"]`).classList.remove('on');
          }
          c.classList.toggle('on', add.has(k));
          sum();
        }),
    );
  $('#bR')
    .querySelectorAll('[data-br]')
    .forEach(
      (c) =>
        (c.onclick = () => {
          const k = c.dataset.br;
          if (rem.has(k)) rem.delete(k);
          else {
            rem.add(k);
            add.delete(k);
            $(`#bA [data-ba="${k}"]`).classList.remove('on');
          }
          c.classList.toggle('on', rem.has(k));
          sum();
        }),
    );
}

function addWorkG(d, n) {

function projEndRisk(t) {
  const p = S.projects[t.projectId];

  if (pe == null || t.status === 'done' || inact(t)) return null;
  const e = dn(t.end);
  const f = fcOf(t).end;
  const last = Math.max(e ?? -Infinity, f ?? -Infinity);
  return last > pe ? { last, pe, byPlan: e > pe } : null;

    const e = dn(t.end),

    if (ME.owner && ownerLeft(t))

        ...base,
        key: 'prk:' + p.id + ':' + iso(last) + ':' + p.end,
        sev: 'bad',
        txt: `No se cumplirá el fin objetivo (${fmt(p.end)}): «${lt.name}» acaba o está prevista el ${fmt(iso(last))}`,
      });
  }
  const rank = { bad: 0, warn: 1 };
  return out.sort(
    (a, b) => rank[a.sev] - rank[b.sev] || (a.kind === b.kind ? 0 : a.kind === 'proj' ? -1 : 1),
  );
}

/* ---------- diario de trabajo (personal y cifrado) ----------
   Each person keeps a private work diary in datos/diario-<id>.json, encrypted with AES-GCM.
   - Project manager: the key is the one derived from the PM password.
   - Team members: a key derived from their own diary password (PBKDF2); nobody else, not even the
     PM, can read it. The key can be remembered in this browser (non-extractable CryptoKey in IndexedDB).
   The file is not part of the shared merge: only its owner reads and writes it. */
const DIARY_APP = 'gantt-diario';
const D = {
  st: 'init',
  who: null,
  days: {},
  key: null,
  salt: null,
  lm: 0,
  timer: null,
  q: Promise.resolve(),
  dirty: false,
};
const DUI = { day: null, mode: 'day', q: '', month: null };
const dFile = () => `diario-${ME.memberId}.json`;
const dfmt = (s) => (s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '');
const dLines = (day) => (D.days[day]?.lines || []).filter((l) => !l.x);
const dDaysWith = () =>
  Object.keys(D.days)
    .filter((k) => dLines(k).length)
    .sort();

async function dRead() {
  try {
    const h = await dirH.getFileHandle(dFile());
    const f = await h.getFile();
    const j = JSON.parse(await f.text());
    return j.app === DIARY_APP ? { j, lm: f.lastModified } : null;
  } catch (e) {
    return null;
  }
}
// Opens the diary of the current user: decrypts it if the key is at hand, otherwise asks for the password
async function dOpen() {
  Object.assign(D, { st: 'loading', who: ME.memberId, days: {}, key: null, salt: null, lm: 0, dirty: false });
  const r = await dRead();
  if (!r) {
    // no diary yet: the PM's is created with the PM key, a member's with their own password
    if (ME.owner && EVKEY) Object.assign(D, { st: 'open', key: EVKEY });
    else D.st = ME.owner ? 'nokey' : 'new';
    return;
  }
  D.salt = r.j.salt || null;
  if (D.salt) {
    // protected with its own password (also a PM who already had a diary as a member)
    const key = await kvGet('dkey-' + ME.memberId);
    if (key && (await dDecrypt(key, r))) return;
    D.st = 'locked';
    return;
  }
  if (ME.owner && EVKEY && (await dDecrypt(EVKEY, r))) return;
  D.st = ME.owner ? 'nokey' : 'foreign';
}
async function dDecrypt(key, r) {
  try {
    if ((await dec(key, r.j.check)) !== 'diario-ok') return false;
    const d = (await dec(key, r.j.box)) || {};
    Object.assign(D, { st: 'open', key, days: d.days || {}, lm: r.lm });
    return true;
  } catch (e) {
    return false;
  }
}
async function dUnlock(pw, remember) {
  const r = await dRead();
  if (!r) {
    // first time: this password creates the diary
    D.salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    D.key = await deriveKey(pw, ub64(D.salt));
    Object.assign(D, { st: 'open', days: {} });
    await dWrite();
  } else {
    D.salt = r.j.salt;
    const key = await deriveKey(pw, ub64(D.salt));
    if (!(await dDecrypt(key, r))) return false;
  }
  if (remember) await kvSet('dkey-' + ME.memberId, D.key);
  return true;
}
function dTouch(day) {
  const o = (D.days[day] = D.days[day] || { lines: [] });
  o.u = Date.now();
  D.dirty = true;
  clearTimeout(D.timer);
  D.timer = setTimeout(dWrite, 700);
}
// Writes the whole diary. If the file changed elsewhere (same person on another computer),
// each day keeps its most recently edited version.
function dWrite() {
  clearTimeout(D.timer);
  D.q = D.q
    .then(async () => {
      if (D.st !== 'open' || !D.key) return;
      const r = await dRead();
      if (r && r.lm !== D.lm) {
        try {
          const other = ((await dec(D.key, r.j.box)) || {}).days || {};
          for (const [k, v] of Object.entries(other))
            if (!D.days[k] || (v.u || 0) > (D.days[k].u || 0)) D.days[k] = v;
        } catch (e) {}
      }
      const text = JSON.stringify({
        app: DIARY_APP,
        version: 1,
        member: ME.memberId,
        salt: D.salt || undefined,
        check: await enc(D.key, 'diario-ok'),
        box: await enc(D.key, { days: D.days }),
        updatedAt: new Date().toISOString(),
      });
      const h = await dirH.getFileHandle(dFile(), { create: true });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      D.lm = (await h.getFile()).lastModified;
      D.dirty = false;
    })
    .catch((e) => dbErr(e));
  return D.q;
}
window.addEventListener('beforeunload', () => {
  if (D.dirty) dWrite();
});

function dAdd(day, text, extra = {}) {
  text = String(text || '').trim();
  if (!text) return null;
  const o = (D.days[day] = D.days[day] || { lines: [] });
  const l = { id: newId(), t: text, ...extra };
  o.lines.push(l);
  dTouch(day);
  return l;
}
const dFind = (day, id) => (D.days[day]?.lines || []).find((l) => l.id === id);
const dPendOpen = () => {
  const out = [];
  for (const day of dDaysWith()) for (const l of dLines(day)) if (l.pend && !l.done) out.push({ day, l });

// What the tool already knows about that day: your meetings, the tasks you had work planned on, absences
function dSuggest(day) {
  const mid = ME.memberId,
    d = dn(day),
    used = new Set(dLines(day).map((l) => l.src));
  const di = dayInfo(mid, d),
    out = [];
  for (const m of di.ms)
    out.push({
      src: 'm:' + m.id,
      ic: '🗓',
      pre: m.time || '',
      t: m.title || '(sin título)',
      p: m.projectId || '',
    });
  for (const { t } of di.ts)
    out.push({ src: 't:' + t.id, ic: '▸', pre: '', t: t.name, p: t.projectId, k: t.id });
  if (di.ab) out.push({ src: 'a:' + di.ab.id, ic: '⏸', pre: '', t: T(absLabel(di.ab)), p: '', noTr: false });
  return out.filter((s) => !used.has(s.src));
}

    u16(20);
    u16(0x0800);
    u16(0);
    u16(0);
    u16(0x21);
    u32(crc(data));
    u32(data.length);
    u32(data.length);
    u16(name.length);
    u16(0);

      u16(0);
      u32(0);

/* ----- importar: Word (.docx) o texto con entradas «Día dd/mm/aaaa» ----- */
async function docxText(buf) {
  const u = new Uint8Array(buf),
    v = new DataView(buf);
  let e = u.length - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  let p = v.getUint32(e + 16, true);
  const n = v.getUint16(e + 10, true),
    td = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const nl = v.getUint16(p + 28, true),
      xl = v.getUint16(p + 30, true),
      cl = v.getUint16(p + 32, true);
    const name = td.decode(u.subarray(p + 46, p + 46 + nl));
    if (name === 'word/document.xml') {
      const meth = v.getUint16(p + 10, true),
        csz = v.getUint32(p + 20, true),
        lo = v.getUint32(p + 42, true);
      const st = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true),
        raw = u.subarray(st, st + csz);
      if (meth === 0) return td.decode(raw);
      const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(ds).text();
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error('docx');

function docxParas(xml) {

    W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const el = (n, name) => [...n.childNodes].find((c) => c.namespaceURI === W && c.localName === name);
  const on = (rpr, name) => {
    const x = rpr && el(rpr, name);
    return !!x && !/^(0|false)$/.test(x.getAttributeNS(W, 'val') || '');
  };
  return [...doc.getElementsByTagNameNS(W, 'p')].map((p) => {
    const segs = [];
    for (const r of p.getElementsByTagNameNS(W, 'r')) {
      const rpr = el(r, 'rPr');
      let t = '';
      for (const c of r.childNodes) {
        if (c.namespaceURI !== W) continue;
        if (c.localName === 't') t += c.textContent;
        else if (c.localName === 'tab' || c.localName === 'br') t += ' ';
        else if (c.localName === 'sym') t += '→';
      }
      if (!t) continue;
      const f = (on(rpr, 'b') ? 'b' : '') + (on(rpr, 'i') ? 'i' : ''),
        last = segs[segs.length - 1];
      if (last && (last.f === f || !t.trim())) last.t += t;
      else segs.push({ t, f });
    }
    // a paragraph that is bold or italic as a whole is a heading or a style, not emphasis
    if (segs.length === 1) return segs[0].t;

      .map((s) => {
        const m = s.t.match(/^(\s*)([\s\S]*?)(\s*)$/),
          k = s.f === 'bi' ? '***' : s.f === 'b' ? '**' : s.f === 'i' ? '*' : '';

      })
      .join('');
  });
}
// "Día 11/06/2026" (or "Day …", or a bare date) starts a day; the following paragraphs are its lines
function dParse(paras) {
  const RE = /^\s*(?:d[ií]a|day)?\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\s*[:.]?\s*$/i,
    days = [];
  let cur = null;
  for (let s of paras) {
    s = s
      .replace(/[]/g, '→')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^[-•·*]\s+/, '');
    if (!s) continue;
    const m = s.replace(/\*/g, '').match(RE);
    if (m) {
      const day = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      cur = dn(day) != null ? { day, lines: [] } : null;
      if (cur) days.push(cur);
      continue;
    }
    if (!cur) continue;
    const l = { t: s };
    const dn2 = s.match(/terminad[oa]\s+(?:el\s+)?(?:d[ií]a\s+)?(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
    if (dn2)
      Object.assign(l, {
        pend: true,
        done: `${dn2[3]}-${dn2[2].padStart(2, '0')}-${dn2[1].padStart(2, '0')}`,
      });
    else if (/\bPENDIENTE\b|\bPENDING\b/.test(s)) l.pend = true;
    cur.lines.push(l);
  }
  return days.filter((d) => d.lines.length);
}

  );

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="${w}" height="${h}">${new XMLSerializer().serializeToString(wrap)}</foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const cv = document.createElement('canvas');
  cv.width = w * scale;
  cv.height = h * scale;
  const c = cv.getContext('2d');
  c.fillStyle = '#fff';
  c.fillRect(0, 0, cv.width, cv.height);
  c.scale(scale, scale);
  c.drawImage(img, 0, 0);
  return cv;
}

  const tasksOf = () => {

  const fillTasks = () => {

    $('#xTs').innerHTML = ts.length
      ? ts
          .map(
            (t) =>
              `<div style="display:flex;gap:8px;align-items:center;margin:2px 0;font-size:12.5px"><input type="checkbox" data-xt="${t.id}" ${st.sel.has(t.id) ? 'checked' : ''} style="width:16px;height:16px;margin:0;flex:0 0 auto"><span style="flex:1">${pids().size > 1 ? '<span class="mut">' + esc(S.projects[t.projectId]?.code || '') + '</span> ' : ''}${esc(t.name)}</span><span class="mut">${fmt(t.start)} – ${fmt(t.end)} · ${t.status === 'done' ? 'terminada' : (t.progress || 0) + ' %'}</span></div>`,
          )

    $('#xTs')
      .querySelectorAll('[data-xt]')

  const autoRange = () => {
    const ts = tasksOf().filter((t) => st.sel.has(t.id));
    if (!ts.length) return;
    let a = Infinity,
      b = -Infinity;
    for (const t of ts) {
      const s0 = dn(t.start);
      if (s0 != null) a = Math.min(a, s0);
      for (const v of [dn(t.end), dn(t.realEnd), t.status !== 'done' ? fcOf(t).end : null])
        if (v != null) b = Math.max(b, v);
    }
    if (a < Infinity) {
      $('#xA').value = iso(a);
      $('#xB').value = iso(b);

  };
  const build = () => {
    const ts = tasksOf().filter((t) => st.sel.has(t.id));
    if (!ts.length) return null;
    const A = dn(val('xA')),
      B = dn(val('xB'));
    if (A == null || B == null || B < A) return null;
    const ppd = +val('xG');
    const y0 = +iso(A).slice(0, 4),

    const s0 =

        ? monday(A)
        : ppd >= 18
          ? A - 1
          : dn(`${y0}-${String(mS + 1).padStart(2, '0')}-01`);
    let e0;
    if (ppd >= 6) {

      const M = monthsIn({ s: B, days: 1 })[0];
      let y = M.y,
        m = M.m + 1;
      if (ppd < 2) m = Math.floor(M.m / 3) * 3 + 3;

    } finally {

    }

      tw = ts.reduce((a, t) => a + w(t), 0),
      pct = tw
        ? Math.round(ts.reduce((a, t) => a + w(t) * (t.status === 'done' ? 100 : t.progress || 0), 0) / tw)
        : 0;
    const pn = [...new Set(ts.map((t) => t.projectId))].map((id) => S.projects[id]);
    const title =

      : '';
    const XW = g.W + 230;
    const css = `#xEl .tname{white-space:normal!important;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;font-size:12px}#xEl .legend span{white-space:nowrap}#xEl .legend{max-width:${XW}px}${ppd < 3 ? '#xEl .ovh{display:none}' : ''}`;
    return `<div id="xEl" style="background:#fff;padding:14px;width:${XW + 30}px;box-sizing:border-box"><style>${css}</style>${head}<div style="border:1px solid var(--line);border-radius:10px;background:#fff;width:${XW}px;box-sizing:border-box"><div class="ginner" style="width:${g.W}px">${g.inner}</div></div>${$('#xL').checked ? g.legend : ''}</div>`;
  };
  const draw = () => {
    const h = build();
    $('#xPv').innerHTML =
      h || '<div class="hint" style="padding:20px">Marca al menos una tarea y un periodo válido.</div>';
    const el = $('#xEl');
    $('#xMsg').innerHTML = el
      ? el.scrollWidth > 2400
        ? `<b style="color:#b54708">La imagen sale de ${el.scrollWidth} px de ancho: para Word, acorta el periodo o usa una escala mayor.</b>`
        : 'Con «Copiar imagen» lo pegas directamente en Word (Ctrl+V).'
      : '';
  };
  $('#xP').onchange = () => {
    st.pid = val('xP');
    fillTasks();
    draw();
  };
  for (const k of ['xG', 'xF', 'xA', 'xB', 'xL', 'xI']) $('#' + k).addEventListener('change', draw);
  for (const k of ['xT', 'xPh']) $('#' + k).addEventListener('input', draw);
  $('#xAll').onclick = () => {

    $('#xTs')

  };
  $('#xNone').onclick = () => {
    st.sel.clear();
    $('#xTs')
      .querySelectorAll('[data-xt]')
      .forEach((c) => (c.checked = false));
    draw();
  };
  const fname = () => {
    const p = S.projects[st.pid];
    return (
      (
        'Gantt ' +
        (p ? p.code || p.name : 'todos') +
        (val('xPh') ? ' ' + val('xPh') : '') +
        ' ' +
        (val('xF') || todayS())
      )
        .replace(/[\\/:*?"<>|·]+/g, '-')
        .replace(/\s+/g, ' ')
        .trim() + '.png'
    );
  };
  const png = async () => {
    const el = $('#xEl');
    if (!el) {
      toast('No hay nada que exportar.');
      return null;
    }
    const cv = await domToPng(el, 2);

  };

      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = fname();
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 500);
      toast('Imagen descargada: ' + fname());
    } catch (e) {
      toast('No se pudo generar la imagen: ' + e.message);
    }
  };
  $('#xCopy').onclick = async () => {
    try {
      const b = png();
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
      toast('Imagen copiada. Pégala en Word con Ctrl+V.');
    } catch (e) {
      toast('El navegador no permite copiar la imagen aquí: usa «Descargar PNG» e insértala en Word.');
    }
  };
  fillTasks();
  draw();
}

/* ---------- dirección del equipo: cambiar la contraseña de PM y traspasar el cargo ---------- */
// The PM password derives the key that encrypts the evaluations, the PM's private projects and the
// PM's diary. Changing it re-encrypts all three; handing the role over re-encrypts only what the team
// keeps (the evaluations) and removes the outgoing PM's personal data from the folder.
async function pmPasswordOk(pw) {
  const c = FILES[PMFILE]?.data.crypto;
  if (!c) return false;
  try {
    return (await dec(await deriveKey(pw, ub64(c.salt)), c.check)) === 'gantt-ok';
  } catch (e) {
    return false;
  }
}
async function removeFile(name) {
  try {
    await dirH.removeEntry(name);
  } catch (e) {}
  delete FILES[name];
}
async function setPmPassword(pw, stage) {
  // read with the old key whatever has to be written with the new one
  if (D.who !== ME.memberId || D.st === 'init' || D.st === 'loading') await dOpen();
  const salt = crypto.getRandomValues(new Uint8Array(16)),
    key = await deriveKey(pw, salt),
    pmDiary = D.st === 'open' && !D.salt;
  EVKEY = key;
  if (FILES[EVFILE] || Object.keys(EVDATA).length) await writeEvals();
  if (FILES[PRFILE]) await writePriv();
  if (pmDiary) {
    D.key = key;
    await dWrite();
  }
  myRecords().crypto = { salt: b64(salt), check: await enc(key, 'gantt-ok') };
  if (stage) stage(myRecords()); // changes that must land in the same write as the new password
  await writeMine();
}

    if (!$('#hoOk').checked) {
      toast('Marca la casilla de confirmación.');
      return false;
    }
    if (!(await pmPasswordOk($('#hoO').value))) {
      toast('Tu contraseña actual no es correcta.');
      return false;
    }
    await pmHandover({ mid, pw, leftOn: leave ? val('hoL') : '', diaryPw: keep ? dpw : '' });
    try {
      localStorage.removeItem(meKey());
    } catch (e) {}
    toast(`Traspaso hecho. ${S.members[mid].name} es ahora el project manager y entra con su contraseña.`);
    setTimeout(() => {
      location.hash = '';
      location.reload();
    }, 2500);
  });
  $('#mSave').textContent = 'Traspasar la dirección';
  $('#hoBk').onclick = () => exportBackup({ evals: $('#hoEv').checked });
  $('#hoDi').onclick = async () => {
    if (D.who !== ME.memberId || D.st !== 'open') await dOpen();
    const days = D.st === 'open' ? dDaysWith() : [];
    if (!days.length) return toast('Tu diario está vacío.');
    dDownload(
      dDocx(days, LAx('Diario de trabajo', 'Work diary')),
      `${LAx('Diario de trabajo', 'Work diary')} ${days[0]}_${days[days.length - 1]}.docx`,
    );
  };
  const upd = () => {
    const leave = val('hoStay') === 'leave';
    document.querySelector('.hoL').style.display = leave ? '' : 'none';
    if (leave) $('#hoD').value = 'del';
    $('#hoD').disabled = leave;
    document.querySelector('.hoK').style.display = val('hoD') === 'keep' && !leave ? '' : 'none';
  };
  $('#hoStay').onchange = upd;
  $('#hoD').onchange = upd;
  upd();
}
// Does the handover. The caller has already checked the current password.
async function pmHandover({ mid, pw, leftOn, diaryPw }) {
  const old = ME.memberId;
  // 1. the outgoing PM's diary: kept under a password of their own, or removed
  await dOpen();
  if (diaryPw && D.st === 'open') {
    D.salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    D.key = await deriveKey(diaryPw, ub64(D.salt));
    await dWrite();
  } else if (!diaryPw) {
    clearTimeout(D.timer);
    await D.q;
    await removeFile(dFile());
  }
  Object.assign(D, { st: 'init', who: null, days: {}, key: null, salt: null, dirty: false });
  // 2. private projects never reach the next PM
  PRDATA = { projects: {}, tasks: {}, settings: {} };
  await writeQ;
  await removeFile(PRFILE);
  // 3. the evaluations move to the new password; the roles change in that same write, so the folder
  //    never holds the new password with the old PM still in charge
  const outgoing = { isPM: false };
  if (leftOn) outgoing.leftOn = leftOn;
  await setPmPassword(pw, (doc) => {
    doc.records.members = doc.records.members || {};
    for (const [id, ch] of [
      [old, outgoing],
      [mid, { isPM: true }],
    ]) {
      const o = { ...S.members[id], ...ch };
      delete o.id;
      doc.records.members[id] = { ...clean(o), _u: stamp(), _by: 'pm' };
    }
  });
  rebuild();
  // 4. the new PM takes over the projects in progress
  const ps = arr('projects')
    .filter((p) => p.ownerId === old && !p.priv && p.status !== 'closed' && p.status !== 'cancelled')
    .map((p) => {
      const o = { ...p, ownerId: mid };
      delete o.id;
      return [p.id, o];
    });
  if (ps.length) await saveMany('projects', ps);
  await writeQ;
}
/* ---------- arrastre de barras ---------- */
function bindDrag() {
  const gw = $('#gw');
  if (!gw) return;
  gw.addEventListener('pointerdown', (e) => {
    const bar = e.target.closest('.bar[data-id]');
    if (!bar || e.button !== 0) return;
    const id = bar.dataset.id,
      t = S.tasks[id];
    if (!t) return;
    if (!canPlan()) {
      openTask(id);
      return;
    }
    e.preventDefault();
    const rz = e.target.classList.contains('rz'),
      x0 = e.clientX,
      l0 = bar.offsetLeft,
      w0 = bar.offsetWidth;
    let moved = false,
      dd = 0;
    dragging = true;
    bar.setPointerCapture(e.pointerId);
    const mv = (ev) => {
      const dx = ev.clientX - x0;
      if (Math.abs(dx) > 3) moved = true;
      dd = Math.round(dx / UI.ppd);
      if (rz) bar.style.width = Math.max(UI.ppd, w0 + dd * UI.ppd) + 'px';
      else bar.style.left = l0 + dd * UI.ppd + 'px';
    };
    const up = () => {
      bar.removeEventListener('pointermove', mv);
      bar.removeEventListener('pointerup', up);
      bar.removeEventListener('pointercancel', up);
      dragging = false;
      if (!moved) {
        if (pendingRender) render();
        openTask(id);
        return;
      }
      if (dd === 0) {
        render();
        return;
      }
      const s = dn(t.start),
        en = dn(t.end),
        nt = { ...t };
      if (rz) nt.end = iso(Math.max(s, en + dd));
      else {
        nt.start = iso(s + dd);
        nt.end = iso(en + dd);
      }
      nt.updatedAt = new Date().toISOString();
      saveTask(id, nt);
      if (pendingRender) render();
    };
    bar.addEventListener('pointermove', mv);
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
  });
}

/* ---------- render ---------- */
function readHash() {
  const v = location.hash.slice(1);
  UI.view = [
    'gantt',
    'equipo',
    'tareas',
    'reuniones',
    'cumplimiento',
    'ausencias',
    'diario',
    'ajustes',
  ].includes(v)
    ? v
    : 'gantt';
}
window.addEventListener('hashchange', () => {
  readHash();
  render();
});
function render() {
  if (!started && dirH) {
    return;
  }
  // do not redraw the diary under the user's cursor when the folder is re-read
  const ae = document.activeElement;
  if (
    UI.view === 'diario' &&
    ae &&
    /INPUT|TEXTAREA|SELECT/.test(ae.tagName) &&
    $('#main').contains(ae) &&
    $('#dMode')
  )
    return;
  if (dragging || $('#modal').classList.contains('show')) {
    pendingRender = true;
    return;
  }
  pendingRender = false;
  resetCal();
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.v === UI.view));
  const old = $('#gw');
  const sl = old?.scrollLeft,
    st = old?.scrollTop;
  const keep = old && old.dataset.v === UI.view && old.dataset.y == UI.year && old.dataset.z == UI.ppd;
  const V = {
    gantt: vGantt,
    equipo: vCalendario,
    tareas: vTareas,
    reuniones: vReuniones,
    cumplimiento: vCumplimiento,
    ausencias: vAusencias,
    diario: vDiario,
    ajustes: vAjustes,
  }[UI.view];
  $('#main').innerHTML = V();
  const gw = $('#gw');
  if (gw) {
    gw.dataset.v = UI.view;
    gw.dataset.y = UI.year;
    gw.dataset.z = UI.ppd;
    if (keep) {
      gw.scrollLeft = sl;
      gw.scrollTop = st;
    } else {
      firstGantt = false;
      const R = range(),
        T = todayN();
      if (
        UI.calMonth &&
        +UI.calMonth.slice(0, 4) === UI.year &&
        !(T >= R.s && T < R.s + R.days && UI.calMonth === todayS().slice(0, 7))
      )
        scrollToMonth(+UI.calMonth.slice(5, 7) - 1);
      else if (T >= R.s && T < R.s + R.days) scrollToday();
      else gw.scrollLeft = 0;
    }
    bindDrag();
    bindTimeTools();
  }
  bindFilters();
  if (UI.view === 'diario') bindDiario();
  const m = $('#main');
  m.querySelectorAll('[data-task]').forEach((el) =>
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openTask(el.dataset.task);
    }),
  );
  m.querySelectorAll('[data-meet]').forEach((el) =>
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openMeeting(el.dataset.meet);
    }),
  );
  if (UI.view === 'equipo') bindCalendar(m);
  m.querySelectorAll('[data-editproj]').forEach(
    (el) => (el.onclick = () => openProject(el.dataset.editproj)),
  );
  m.querySelectorAll('[data-editmem]').forEach((el) => (el.onclick = () => openMember(el.dataset.editmem)));
  m.querySelectorAll('[data-tog]').forEach(
    (el) =>
      (el.onclick = () => {
        const p = el.dataset.tog;
        UI.collapsed.has(p) ? UI.collapsed.delete(p) : UI.collapsed.add(p);
        render();
      }),
  );
  m.querySelectorAll('[data-addin]').forEach(
    (el) => (el.onclick = () => openTask(null, { projectId: el.dataset.addin })),
  );
  const on = (id, f) => {
    const e = $('#' + id);
    if (e) e.onclick = f;
  };
  on('addTask2', () => openTask(null));
  on('addMeet2', () => openMeeting(null));
  on('impIcs', openImportICS);
  on('addProj', () => openProject(null));
  on('addMem', () => openMember(null));
  if (UI.view === 'reuniones') {
    on('yPrev', () => {
      UI.year--;
      if (UI.meetPeriod !== 'all' && UI.meetPeriod !== 'future')
        UI.meetPeriod = UI.year + UI.meetPeriod.slice(4);
      render();
    });
    on('yNext', () => {
      UI.year++;
      if (UI.meetPeriod !== 'all' && UI.meetPeriod !== 'future')
        UI.meetPeriod = UI.year + UI.meetPeriod.slice(4);
      render();
    });
    $('#perSel').onchange = (e) => {
      UI.meetPeriod = e.target.value;
      render();
    };
    $('#mmSel').onchange = (e) => {
      UI.meetMember = e.target.value;
      render();
    };
    {
      const mq = $('#mQ');
      let tm;
      mq.oninput = () => {
        clearTimeout(tm);
        tm = setTimeout(() => {
          UI.meetQ = mq.value;
          render();
          const n = $('#mQ');
          n.focus();
          n.setSelectionRange(n.value.length, n.value.length);
        }, 250);
      };
    }
    on('mSelT', () => {
      UI.meetSel = !UI.meetSel;
      UI.meetPick = new Set();
      render();
    });
    m.querySelectorAll('[data-msel]').forEach(
      (el) =>
        (el.onclick = () => {
          const id = el.dataset.msel;
          UI.meetPick.has(id) ? UI.meetPick.delete(id) : UI.meetPick.add(id);
          render();
        }),
    );
    on('mSelAll', () => {
      for (const el of m.querySelectorAll('[data-msel]')) UI.meetPick.add(el.dataset.msel);
      render();
    });
    on('mSelNone', () => {
      UI.meetPick = new Set();
      render();
    });
    on('mSelEdit', () => openBulkMeetings([...UI.meetPick]));
  }
  if (UI.view === 'ausencias') {
    on('yPrev', () => {
      UI.year--;
      render();
    });
    on('yNext', () => {
      UI.year++;
      render();
    });
    $('#aMem').onchange = (e) => {
      UI.member = e.target.value;
      render();
    };
    on('addAbs', () => openAbsence(null));
    on('addExt', () => openExtra(null));
    m.querySelectorAll('[data-ext]').forEach((r) => (r.onclick = () => openExtra(r.dataset.ext)));
    on('addHol', () => openHoliday(null));
    on('copyHol', copyHolidays);
    on('impHol', openImportHolidays);
    m.querySelectorAll('[data-abs]').forEach((el) => (el.onclick = () => openAbsence(el.dataset.abs)));
    m.querySelectorAll('[data-hol]').forEach((el) => (el.onclick = () => openHoliday(el.dataset.hol)));
  }
  if (UI.view === 'tareas')
    $('#sortSel').onchange = (e) => {
      UI.sort = e.target.value;
      render();
    };
  {
    const rows = () =>
      [...document.querySelectorAll('#ptT tr[data-pt]')].map((r) => ({
        id: r.dataset.pt,
        name: r.querySelector('.ptN').value.trim(),
        color: r.querySelector('.ptC').value,
      }));
    const put = async (list, msg) => {
      if (list.some((t) => !t.name)) {
        toast('Ningún tipo puede quedar sin nombre.');
        return;
      }
      const names = list.map((t) => norm(t.name));
      if (new Set(names).size !== names.length) {
        toast('Hay dos tipos con el mismo nombre.');
        return;
      }
      if (await save('config', 'settings', { ...(S.config.settings || {}), ptypes: list })) toast(msg);
    };
    on('savePt', () => put(rows(), 'Tipos de proyecto guardados.'));
    on('addPt', () => {
      const T = $('#ptT');
      if (!T.querySelector('tr[data-pt]')) T.innerHTML = '<tbody></tbody>';
      const tr = document.createElement('tr');
      tr.dataset.pt = 'pt-' + newId();
      tr.innerHTML = `<td style="width:46px"><input type="color" class="ptC" value="${PALETTE[T.rows.length % PALETTE.length]}" style="height:30px;width:40px;border:1px solid var(--line);border-radius:6px;padding:1px"></td><td><input type="text" class="ptN" placeholder="Nombre del nuevo tipo" style="width:100%"></td><td class="mut" style="width:110px">nuevo</td><td style="width:80px"><button class="btn sm ptDel" title="Quitar">✕</button></td>`;
      (T.tBodies[0] || T).appendChild(tr);
      tr.querySelector('.ptDel').onclick = () => tr.remove();
      tr.querySelector('.ptN').focus();
    });
    document.querySelectorAll('#ptT .ptDel').forEach(
      (b) =>
        (b.onclick = () => {
          const id = b.closest('tr').dataset.pt;
          put(
            rows().filter((t) => t.id !== id),
            'Tipo quitado.',
          );
        }),
    );
    document.querySelectorAll('#ptT .ptUp').forEach(
      (b) =>
        (b.onclick = () => {
          const l = rows(),
            i = l.findIndex((t) => t.id === b.closest('tr').dataset.pt);
          [l[i - 1], l[i]] = [l[i], l[i - 1]];
          put(l, 'Orden guardado.');
        }),
    );
  }
  on('saveRb', async () => {
    const r = [1, 2, 3, 4, 5].map((i) => $('#rb' + i).value.trim() || RUBRIC[i - 1]);
    if (await save('config', 'settings', { ...(S.config.settings || {}), rubric: r }))
      toast('Escala guardada.');
  });
  on('resetRb', async () => {
    const o = { ...(S.config.settings || {}) };
    delete o.rubric;
    if (await save('config', 'settings', o)) toast('Textos restaurados.');
  });
  on('saveW', async () => {
    const w = {
      plazo: +$('#wPlazo').value || 0,
      calidad: +$('#wCal').value || 0,
      alcance: +$('#wAlc').value || 0,
      retrabajo: +$('#wRet').value || 0,
    };
    if (!(w.plazo + w.calidad + w.alcance + w.retrabajo)) {
      toast('Al menos un peso debe ser mayor que 0.');
      return;
    }
    if (await save('config', 'settings', { ...(S.config.settings || {}), weights: w }))
      toast('Pesos guardados.');
  });
  on('addCenter', () => openCenter(null));
  m.querySelectorAll('[data-center]').forEach((el) => (el.onclick = () => openCenter(+el.dataset.center)));
  on('tbCreate', createTBFile);
  on('tbReload', () => refresh(true));
  m.querySelectorAll('[data-meetlink]').forEach(
    (a) =>
      (a.onclick = (e) => {
        e.preventDefault();
        openMeeting(a.dataset.meetlink);
      }),
  );
  on('icsMe', () => downloadICS(ME.memberId));
  on('icsTeam', () => downloadICS(null));
  on('bkExp', () => exportBackup());
  on('pmPw', openChangePw);
  on('pmHo', openPmHandover);
  on('pvHs', async () => {
    const v = +val('pvH');
    if (!(v > 0)) {
      toast('Indica las horas.');
      return;
    }
    PRDATA.settings = { ...(PRDATA.settings || {}), hoursPerDay: v };
    await writePriv();
    rebuild();
    render();
    toast('Calendario privado: ' + v + ' h/día.');
  });
  const bi = $('#bkImp');
  if (bi)
    bi.onchange = () => {
      if (bi.files[0]) importBackup(bi.files[0]);
    };
  meBox();
}
init();
